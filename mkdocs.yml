site_name: MowDeck
site_description: Self-hosted, manufacturer-independent control centre for robotic lawn mowers
repo_url: https://github.com/lukislp/mowdeck
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  adr/template.md

