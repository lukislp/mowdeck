[project]
name = "mowdeck-provider-testkit"
version = "0.1.0"
description = "Provider conformance kit: the vendor-neutral pytest suite every MowDeck adapter package runs against its own fake vendor client."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# A test-only library: adapter packages list it in their test dependencies, never at runtime.
dependencies = [
  "mowdeck-contracts",
  "mowdeck-control",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
]

[tool.uv.sources]
mowdeck-contracts = { workspace = true }
mowdeck-control = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mowdeck_provider_testkit"]
