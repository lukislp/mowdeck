[project]
name = "mowdeck-service-kit"
version = "0.1.0"
description = "Skeleton of every MowDeck service: settings, logging, errors, health, event bus, tenancy."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-contracts",
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.0",
  "pydantic-settings>=2.15.0",
  "structlog>=26.1.0",
  "nats-py>=2.16.0",
  "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]
db = [
  "sqlalchemy[asyncio]>=2.1.4",
  "asyncpg>=0.32.0",
]
testing = ["httpx>=0.28.1"]

[tool.uv.sources]
mowdeck-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mowdeck_service_kit"]
