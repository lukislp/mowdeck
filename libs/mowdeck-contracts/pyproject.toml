[project]
name = "mowdeck-contracts"
version = "0.1.0"
description = "MowDeck API and event contracts: Pydantic v2 models and JSON Schemas, no I/O."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.14.0"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mowdeck_contracts"]
