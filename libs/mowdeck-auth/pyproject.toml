[project]
name = "mowdeck-auth"
version = "0.1.0"
description = "Access tokens for MowDeck: EdDSA JWT issuing and verification with a cached JWKS."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-contracts",
  "mowdeck-service-kit",
  "pyjwt[crypto]>=2.10.1",
  "cryptography>=44.0.0",
  "httpx>=0.28.1",
]

[tool.uv.sources]
mowdeck-contracts = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mowdeck_auth"]
