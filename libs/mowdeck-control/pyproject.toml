[project]
name = "mowdeck-control"
version = "0.1.0"
description = "Mower control without the platform: MowerConnection interface, safety controller, simulated mower."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["mowdeck-contracts"]

[project.optional-dependencies]
# Draws the simulator's still images (capture_photo); without it the image is a flat PNG.
photo = ["pillow>=11.0.0"]

[project.entry-points."mowdeck.connections"]
simulated = "mowdeck_control.simulator:create_simulated_connection"

[tool.uv.sources]
mowdeck-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mowdeck_control"]
