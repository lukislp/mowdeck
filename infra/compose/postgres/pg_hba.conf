# Client authentication of the Compose stack's PostgreSQL (hba_file in docker-compose.yml).
# Internal TLS (docs/ops/internal-tls.md): a connection over the network must use TLS and a
# password (scram-sha-256); without TLS it is refused. The Unix socket and the container's own
# loopback keep the image's defaults (the init scripts, `docker compose exec postgres psql`,
# pg_dumpall of deploy.sh and the health check never leave the container).

# TYPE    DATABASE  USER  ADDRESS       METHOD
local     all       all                 trust
host      all       all   127.0.0.1/32  trust
host      all       all   ::1/128       trust
hostssl   all       all   all           scram-sha-256
hostnossl all       all   all           reject
