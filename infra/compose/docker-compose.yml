  # --- Camera relay (ADR 0045): only with `--profile relay` ---------------------------------
  # Shared camera sessions per account and mower, leases with a grace period, tickets and the
  # lifecycle events (stream CAMERA). The service itself is internal: it answers
  # relay.camera.attach|renew|detach on NATS and MediaMTX's auth callback, and has no Traefik
  # route. It asks the Device-Gateway for the camera session, runs the source pipeline (ffmpeg:
  # the simulator's fake source, the agora-bridge muxer and the transcoder for vendor sources)
  # and publishes into MediaMTX. Sources without an available driver (Agora without the
  # agora-bridge below) are answered with "unsupported_provider". Single
  # replica, state in memory. Tickets are signed with a key of the process unless
  # MOWDECK_RELAY_TICKET_SIGNING_KEY(_FILE) is set; the internal publisher credential is a
  # random secret of the process unless MOWDECK_RELAY_PUBLISHER_SECRET(_FILE) is set.
  camera-relay:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/camera-relay:${MOWDECK_VERSION:-dev}
    profiles: [relay]
    build:
      context: ../..
      dockerfile: services/camera-relay/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: camera-relay
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_CAMERA_RELAY:?set NATS_PASSWORD_CAMERA_RELAY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_RELAY_MEDIAMTX_API_URL: http://mediamtx:9997
      MOWDECK_RELAY_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      # The optional agora-bridge (profile agora) on this container's loopback; while nothing
      # listens there, agora mowers are unsupported_provider (direct path).
      MOWDECK_RELAY_AGORA_BRIDGE_URL: tcp://127.0.0.1:7700
      # Vision's frames (POST /internal/v1/frames/snapshot, internal only): the shared secret
      # of the Device-Gateway (GATEWAY_RELAY_URL). Empty: the frame tap is off.
      MOWDECK_RELAY_FRAMES_TOKEN: ${RELAY_FRAMES_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      mediamtx:
        condition: service_started
    networks: [mowdeck]

  # MediaMTX (MIT): the relay's data plane, only with `--profile relay`. The relay publishes over
  # RTSP (:8554, internal); browsers read over WHEP: Traefik routes /media/whep/r/... to :8889
  # (prefix stripped) and nothing else of it. Media flows on the ICE port RELAY_ICE_PORT (UDP and
  # TCP, published on RELAY_ICE_BIND) to the addresses RELAY_ICE_HOSTS; clients in the LAN must
  # reach that port. The API (:9997) is reachable inside this network only and every request is
  # authorized by camera-relay; metrics, playback and pprof are off. Config:
  # infra/compose/mediamtx/mediamtx.yml. The image has no shell, so it has no health check.
  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.21.2}
    profiles: [relay]
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_AUTHHTTPADDRESS: http://camera-relay:8000/internal/mediamtx/auth
      MTX_WEBRTCADDITIONALHOSTS: ${RELAY_ICE_HOSTS:-127.0.0.1}
      MTX_WEBRTCLOCALUDPADDRESS: :${RELAY_ICE_PORT:-8189}
      MTX_WEBRTCLOCALTCPADDRESS: :${RELAY_ICE_PORT:-8189}
    ports:
      - "${RELAY_ICE_BIND:-0.0.0.0}:${RELAY_ICE_PORT:-8189}:${RELAY_ICE_PORT:-8189}/udp"
      - "${RELAY_ICE_BIND:-0.0.0.0}:${RELAY_ICE_PORT:-8189}:${RELAY_ICE_PORT:-8189}/tcp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.mediamtx-whep.rule=PathPrefix(`/media/whep/r/`)
      - traefik.http.routers.mediamtx-whep.entrypoints=web
      - traefik.http.routers.mediamtx-whep.middlewares=mediamtx-whep-strip
      - traefik.http.middlewares.mediamtx-whep-strip.stripprefix.prefixes=/media/whep
      - traefik.http.services.mediamtx-whep.loadbalancer.server.port=8889
    stop_grace_period: 5s
    networks: [mowdeck]

  # agora-bridge (ADR 0045 step 7): the optional Agora source of the camera relay, only with
  # `--profile relay --profile agora`. Its code is Apache-2.0, but the image contains Agora's
  # proprietary SDK: it is built here from integrations/agora-bridge and never pulled or
  # published (pull_policy: build); building it downloads the SDK from Agora (pinned and hash
  # checked) and means accepting Agora's licence, see integrations/agora-bridge/README.md. It
  # shares camera-relay's network namespace and listens on its loopback only (127.0.0.1:7700,
  # MOWDECK_RELAY_AGORA_BRIDGE_URL); vendor tokens never leave that namespace. Without it the
  # relay answers agora mowers with unsupported_provider, so the web app uses the direct path.
  # x86_64 hosts only (the pinned native SDK).
  agora-bridge:
    image: mowdeck-local/agora-bridge:local
    profiles: [agora]
    pull_policy: build
    build:
      context: ../../integrations/agora-bridge
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: "service:camera-relay"
    environment:
      AGORA_BRIDGE_LISTEN: 127.0.0.1:7700
      AGORA_BRIDGE_MAX_SESSIONS: "4"
    depends_on:
      camera-relay:
        condition: service_started
        restart: true
    stop_grace_period: 15s

  # --- Billing (ADR 0031): only with `--profile billing` -----------------------------------
  # billing.enabled=false (the default) means these two services are not started at all: no
  # route, the web app's probe of /api/v1/billing/status gets 404 and shows nothing. Enable it
  # with COMPOSE_PROFILES=billing (or --profile billing) together with
  # ENTITLEMENTS_BILLING_ENABLED=true, and set the BILLING_* variables (docs/ops/billing.md).
  # One-shot job: Alembic migrations of the billing database (idempotent).
  billing-migrate:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/billing:${MOWDECK_VERSION:-dev}
    profiles: [billing]
    build:
      context: ../..
      dockerfile: services/billing/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "billing.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://billing:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/billing
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Subscriptions and payments: Stripe Checkout and customer portal, webhooks that set the
  # account plan in Entitlements (entitlements.plan.set). No card data passes through MowDeck.
  # The price file is infra/billing/prices.yaml (mounted read-only); BILLING_PRICE_IDS
  # overrides it with the ids of the operator's Stripe account.
  billing:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/billing:${MOWDECK_VERSION:-dev}
    profiles: [billing]
    build:
      context: ../..
      dockerfile: services/billing/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../billing/prices.yaml:/etc/mowdeck/billing/prices.yaml:ro
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: billing
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_BILLING:?set NATS_PASSWORD_BILLING in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_DATABASE_URL: postgresql://billing:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/billing
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
      MOWDECK_BILLING_PROVIDER: ${BILLING_PROVIDER:-stripe}
      MOWDECK_BILLING_STRIPE_SECRET_KEY: ${BILLING_STRIPE_SECRET_KEY:-}
      MOWDECK_BILLING_STRIPE_WEBHOOK_SECRET: ${BILLING_STRIPE_WEBHOOK_SECRET:-}
      MOWDECK_BILLING_STRIPE_API_BASE: ${BILLING_STRIPE_API_BASE:-}
      MOWDECK_BILLING_AUTOMATIC_TAX: ${BILLING_AUTOMATIC_TAX:-false}
      MOWDECK_BILLING_PRICE_IDS: ${BILLING_PRICE_IDS:-}
      MOWDECK_BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-14}
      MOWDECK_BILLING_APP_URL: ${BILLING_APP_URL:-}
      MOWDECK_BILLING_ENTITLEMENTS_URL: http://entitlements:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.billing.rule=PathPrefix(`/api/v1/billing`)
      - traefik.http.routers.billing.entrypoints=web
      - traefik.http.routers.billing.service=billing
      # Stripe webhooks need no token (only the signature counts): rate limited per client IP
      # like the login routes, with room for Stripe's bursts (Stripe retries a 429 later).
      - traefik.http.routers.billing-webhook.rule=Path(`/api/v1/billing/webhooks/stripe`)
      - traefik.http.routers.billing-webhook.entrypoints=web
      - traefik.http.routers.billing-webhook.priority=100
      - traefik.http.routers.billing-webhook.middlewares=billing-webhook-ratelimit
      - traefik.http.routers.billing-webhook.service=billing
      - traefik.http.middlewares.billing-webhook-ratelimit.ratelimit.average=120
      - traefik.http.middlewares.billing-webhook-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.billing-webhook-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.billing-webhook-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=${GATEWAY_CLIENT_IP_DEPTH:-0}
      - traefik.http.middlewares.billing-webhook-ratelimit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.services.billing.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      entitlements:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]

  # One-shot job: Alembic migrations of the planner database (idempotent).
  planner-migrate:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/planner:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/planner/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "planner.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://planner:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/planner
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Mowing patterns and spot mowing (ADR 0030): computes, validates and previews routes from
  # the map snapshots on the DEVICE stream, the coverage from Telemetry's position track
  # (tracks.positions.query), and keeps the pattern templates of every account.
  planner:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/planner:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/planner/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: planner
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_PLANNER:?set NATS_PASSWORD_PLANNER in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_DATABASE_URL: postgresql://planner:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/planner
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
      MOWDECK_ENTITLEMENTS_BILLING_ENABLED: ${ENTITLEMENTS_BILLING_ENABLED:-false}
      MOWDECK_PLANNER_CUTTING_WIDTH_M: ${PLANNER_CUTTING_WIDTH_M:-0.4}
      MOWDECK_PLANNER_MAX_PARALLEL: ${PLANNER_MAX_PARALLEL:-2}
    labels:
      - traefik.enable=true
      - traefik.http.routers.planner.rule=PathPrefix(`/api/v1/planner`)
      - traefik.http.routers.planner.entrypoints=web
      - traefik.http.services.planner.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      planner-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]

  # Matter server (ADR 0063), only with `--profile matter`: every mower as its own Matter node
  # (Robotic Vacuum Cleaner) for Apple Home, Google Home and Home Assistant: start, pause,
  # return to the dock, state and battery; no emergency stop. It runs on the HOST network,
  # because Matter needs mDNS and IPv6 link-local on the LAN: each mower node listens on its own
  # UDP port from MATTER_PORT_BASE, the admin API (pairing codes for the web app) on
  # MATTER_HTTP_PORT. Open both only to the LAN and Docker's bridge (docs/ops/matter.md).
  # Traefik and Identity reach it through host.docker.internal. It calls MowDeck's API through
  # Traefik on the host (MATTER_API_URL) with the API tokens in
  # infra/compose/secrets/matter/api-tokens (git-ignored; one token per account, rights
  # mower.view and mower.control only). Fabrics and pairing codes live in the matter-data volume.
  matter-server:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/matter-server:${MOWDECK_VERSION:-dev}
    profiles: [matter]
    build:
      context: ../..
      dockerfile: services/matter-server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    network_mode: host
    volumes:
      - matter-data:/data
      - ./secrets/matter:/run/secrets/matter:ro
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_MATTER_API_URL: ${MATTER_API_URL:-http://127.0.0.1:${GATEWAY_HTTP_PORT:-80}}
      MOWDECK_MATTER_API_TOKENS_FILE: /run/secrets/matter/api-tokens
      MOWDECK_MATTER_HTTP_PORT: ${MATTER_HTTP_PORT:-8790}
      MOWDECK_MATTER_PORT_BASE: ${MATTER_PORT_BASE:-5540}
      MOWDECK_MATTER_MAX_NODES: ${MATTER_MAX_NODES:-16}
      MOWDECK_MATTER_LANGUAGE: ${MATTER_LANGUAGE:-de}
      MOWDECK_MATTER_MDNS_INTERFACE: ${MATTER_MDNS_INTERFACE:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.matter.rule=PathPrefix(`/api/v1/matter`)
      - traefik.http.routers.matter.entrypoints=web
      - traefik.http.services.matter.loadbalancer.server.port=${MATTER_HTTP_PORT:-8790}
    stop_grace_period: 20s

  # The web app (apps/web): a static SvelteKit PWA served by an unprivileged, read-only
  # nginx at / on the same origin as the API, so no CORS is needed and the refresh cookie
  # (SameSite=Strict) works as is. Priority 1 keeps every /api/v1 route ahead of it.
  web:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/web:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1}
        NGINX_IMAGE: ${NGINX_IMAGE:-public.ecr.aws/nginx/nginx-unprivileged:1.30.5-alpine@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86}
        # The Agora Web SDK for the direct camera path (ADR 0032) in this locally built image
        # only; the published web image never contains it (apps/web/README.md, "Agora Web SDK").
        # "exclude" builds what the release publishes.
        WEB_AGORA_SDK: ${WEB_AGORA_SDK:-include}
        # Version and source ref the app shows (AGPL-3.0 section 13); empty: "development build".
        # The release build sets them itself; demo/reset.sh sets them from a checked-out tag.
        MOWDECK_VERSION: ${MOWDECK_BUILD_VERSION:-}
        MOWDECK_SOURCE_REF: ${MOWDECK_BUILD_REF:-}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      # Optional raster tiles under the map (empty: metric grid, no third party). Rendered into
      # /config.json and the CSP img-src at container start.
      MOWDECK_WEB_MAP_TILES: ${WEB_MAP_TILES:-}
      MOWDECK_WEB_MAP_ATTRIBUTION: ${WEB_MAP_ATTRIBUTION:-}
      MOWDECK_WEB_MAP_MAX_ZOOM: ${WEB_MAP_MAX_ZOOM:-19}
      # Links to the legal pages on the login page (placeholders until the operator fills them).
      MOWDECK_WEB_LEGAL_ENABLED: ${WEB_LEGAL_ENABLED:-false}
      # Live camera through Agora (ADR 0032): adds the Agora domains to the CSP.
      MOWDECK_WEB_CAMERA_ENABLED: ${WEB_CAMERA_ENABLED:-false}
      # Interactive API explorer at /api-explorer (ADR 0072), meant for the public demo: off.
      MOWDECK_WEB_API_EXPLORER: ${WEB_API_EXPLORER:-false}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [mowdeck]

networks:
  mowdeck:
    # Another name lets a second stack run next to this one (isolated test runs).
    name: ${MOWDECK_NETWORK:-mowdeck}

volumes:
  nats-data:
  postgres-data:
  notifications-data:
  aerial-cache:
  # Matter fabrics and the setup credentials of every mower node (profile matter).
  matter-data:
