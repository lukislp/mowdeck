      MOWDECK_VISION_AUTO_PHOTO_ATTEMPTS: ${VISION_AUTO_PHOTO_ATTEMPTS:-3}
      MOWDECK_VISION_AUTO_PHOTO_RETRY_SECONDS: ${VISION_AUTO_PHOTO_RETRY_SECONDS:-15}
