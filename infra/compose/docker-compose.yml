# MowDeck foundation stack (self-hosted mode).
#
# Start:  docker compose -f infra/compose/docker-compose.yml up -d --wait
# Config: copy .env.example to .env in this directory first. The password
#         variables are required; everything else has a default.
#
# Every MowDeck service joins the "mowdeck" network, gets a Traefik router via
# labels under /api/v1/<name> and, when it stores data, uses its own database
# and role created by init/01-databases.sql.

name: mowdeck

# The repository of the running code: the web app links it and every service names it in the
# X-Source-Code response header (AGPL-3.0 section 13, LICENSING.md). A fork that runs modified
# code sets SOURCE_URL to its own public repository. Version and ref come from the image build.
x-source-code: &source-code
  MOWDECK_SOURCE_URL: ${SOURCE_URL:-https://github.com/lukislp/mowdeck}

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-public.ecr.aws/docker/library/traefik:v3.7.14}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${MOWDECK_NETWORK:-mowdeck}
      # Only containers of this Compose project: a second stack on the same host must not be
      # routed by this Traefik (router names collide). Set MOWDECK_TRAEFIK_PROJECT=<-p name>.
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${MOWDECK_TRAEFIK_PROJECT:-mowdeck}`)
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Your own reverse proxy in front of this Traefik (comma separated IPs/CIDRs): only from these
      # addresses are incoming X-Forwarded-For/-Proto/-Host kept, so Identity sees the real client
      # IP. Empty (default): Traefik trusts no one and sets the headers from the TCP peer itself.
      - --entrypoints.web.forwardedHeaders.trustedIPs=${GATEWAY_TRUSTED_PROXIES:-}
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${GATEWAY_TRUSTED_PROXIES:-}
      - --api.dashboard=false
      - --ping=true
      - --log.level=INFO
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      # Read-only socket for service discovery. In production, front the socket
      # with a restricted proxy or use the file/Kubernetes providers instead.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Containers on the host network (matter-server, profile matter) are routed to the host's
    # address on Docker's bridge, which Traefik looks up as host.docker.internal.
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # API traffic is admitted once Identity, Fleet, Telemetry, Realtime, Notifications, Scheduler,
    # Entitlements, Planner, Vision and the web app are ready (they need their migrated databases,
    # the authorization model and NATS). They depend on the one-shot jobs identity-migrate,
    # fleet-migrate, telemetry-migrate, notifications-migrate, scheduler-migrate,
    # entitlements-migrate, planner-migrate, vision-migrate and authz-bootstrap, so `up --wait` accepts them (an
    # exited job counts as done only when another service depends on it).
    depends_on:
      identity:
        condition: service_healthy
      fleet:
        condition: service_healthy
      telemetry:
        condition: service_healthy
      realtime:
        condition: service_healthy
      notifications:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      entitlements:
        condition: service_healthy
      planner:
        condition: service_healthy
      vision:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [mowdeck]

  # Placeholder for routing: proves that label-based /api/v1 routing works.
  # Real services replace it with their own labels. Only started with
  # `--profile whoami`; try `curl http://localhost/api/v1/whoami`. (The public demo is the
  # override docker-compose.demo.yml, not a profile.)
  whoami:
    image: ${WHOAMI_IMAGE:-ghcr.io/traefik/whoami:v1.10.3}
    profiles: [whoami]
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=PathPrefix(`/api/v1/whoami`)
      - traefik.http.routers.whoami.entrypoints=web
      - traefik.http.routers.whoami.middlewares=whoami-strip
      - traefik.http.middlewares.whoami-strip.stripprefix.prefixes=/api/v1/whoami
      - traefik.http.services.whoami.loadbalancer.server.port=80
    networks: [mowdeck]

  # Every client authenticates with its own user and may use only the subjects its service needs
  # (ADR 0074): nats/auth.conf, generated from the subject map in
  # tools/repo-checks/scripts/nats_auth.py. The passwords are NATS_PASSWORD_<USER> in .env
  # (./nats-passwords.sh .env generates them); each service gets only its own.
  nats:
    image: ${NATS_IMAGE:-public.ecr.aws/docker/library/nats:2.15.0-alpine}
    restart: unless-stopped
    command: ["-c", "/etc/nats/mowdeck/auth.conf", "-js", "-m", "8222", "-sd", "/data"]
    environment:
      NATS_PASSWORD_BILLING: ${NATS_PASSWORD_BILLING:?set NATS_PASSWORD_BILLING in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_CAMERA_RELAY: ${NATS_PASSWORD_CAMERA_RELAY:?set NATS_PASSWORD_CAMERA_RELAY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_DEVICE_GATEWAY: ${NATS_PASSWORD_DEVICE_GATEWAY:?set NATS_PASSWORD_DEVICE_GATEWAY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_ENTITLEMENTS: ${NATS_PASSWORD_ENTITLEMENTS:?set NATS_PASSWORD_ENTITLEMENTS in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_FLEET: ${NATS_PASSWORD_FLEET:?set NATS_PASSWORD_FLEET in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_IDENTITY: ${NATS_PASSWORD_IDENTITY:?set NATS_PASSWORD_IDENTITY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_NOTIFICATIONS: ${NATS_PASSWORD_NOTIFICATIONS:?set NATS_PASSWORD_NOTIFICATIONS in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_PLANNER: ${NATS_PASSWORD_PLANNER:?set NATS_PASSWORD_PLANNER in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_REALTIME: ${NATS_PASSWORD_REALTIME:?set NATS_PASSWORD_REALTIME in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_SCHEDULER: ${NATS_PASSWORD_SCHEDULER:?set NATS_PASSWORD_SCHEDULER in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_STREAMS: ${NATS_PASSWORD_STREAMS:?set NATS_PASSWORD_STREAMS in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_TELEMETRY: ${NATS_PASSWORD_TELEMETRY:?set NATS_PASSWORD_TELEMETRY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      NATS_PASSWORD_VISION: ${NATS_PASSWORD_VISION:?set NATS_PASSWORD_VISION in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
      - ./nats:/etc/nats/mowdeck:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [mowdeck]

  # One-shot job: creates the JetStream streams and updates them to the contract settings
  # (idempotent, safe on every `up`). It is the only NATS user allowed to change a stream; the
  # services wait for it (ADR 0074). Runs in the identity image, which the stack builds anyway.
  nats-streams:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/identity:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "mowdeck_service_kit.bus.streams"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: streams
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_STREAMS:?set NATS_PASSWORD_STREAMS in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:17.11-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD in infra/compose/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, not the socket: on a fresh volume the image's entrypoint runs the init scripts
      # on a temporary server that listens on the Unix socket only, so a socket check reports
      # healthy before the real server accepts the migrations' TCP connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [mowdeck]

  openfga-migrate:
    image: ${OPENFGA_IMAGE:-ghcr.io/openfga/openfga:v1.22.0}
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  openfga:
    image: ${OPENFGA_IMAGE:-ghcr.io/openfga/openfga:v1.22.0}
    command: run
    restart: unless-stopped
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_GRPC_ADDR: 0.0.0.0:8081
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${OPENFGA_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${OPENFGA_GRPC_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [mowdeck]

  # One-shot job: creates the OpenFGA store "mowdeck" if it is missing and
  # writes infra/openfga/model.fga only when it differs from the latest model
  # (idempotent, safe on every `up`). Services find the store by name and pin
  # the latest model at startup (mowdeck-authz), so no ids need copying.
  # Identity, Fleet and Telemetry depend on it with service_completed_successfully.
  authz-bootstrap:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/authz-bootstrap:${MOWDECK_VERSION:-dev}
    build:
      context: ../openfga
      dockerfile: bootstrap/Dockerfile
      args:
        FGA_CLI_IMAGE: ${FGA_CLI_IMAGE:-openfga/cli:v0.8.1@sha256:1b8035ea4aeb8ad739cbea972488cdda37886644ed004737880b63403bae0fe8}
        JQ_IMAGE: ${JQ_IMAGE:-ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91}
        BUSYBOX_IMAGE: ${BUSYBOX_IMAGE:-public.ecr.aws/docker/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    environment:
      FGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      FGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      FGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
    depends_on:
      openfga:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    networks: [mowdeck]

  # One-shot job: Alembic migrations of the identity database (idempotent).
  identity-migrate:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/identity:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "identity.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://identity:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/identity
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Accounts, users, roles, sessions, API tokens; issues the access tokens
  # (EdDSA JWT) and publishes the public keys at /.well-known/jwks.json.
  # Services verify tokens locally with mowdeck-auth against
  # http://identity:8000/.well-known/jwks.json (inside the compose network).
  identity:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/identity:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: identity
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_IDENTITY:?set NATS_PASSWORD_IDENTITY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_DATABASE_URL: postgresql://identity:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/identity
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      MOWDECK_IDENTITY_KEY_ENCRYPTION_KEY: ${IDENTITY_KEY_ENCRYPTION_KEY:?set IDENTITY_KEY_ENCRYPTION_KEY in infra/compose/.env}
      MOWDECK_IDENTITY_REGISTRATION: ${IDENTITY_REGISTRATION:-open}
      MOWDECK_IDENTITY_ARGON2_PROFILE: ${IDENTITY_ARGON2_PROFILE:-rfc9106_low}
      # Optional modules add their URL in IDENTITY_EXTRA_MODULE_URLS (comma separated), e.g. the
      # Matter server on the host network: http://host.docker.internal:8790 (ADR 0063).
      MOWDECK_IDENTITY_MODULE_URLS: http://device-gateway:8000,http://fleet:8000,http://telemetry:8000,http://realtime:8000,http://notifications:8000,http://scheduler:8000,http://entitlements:8000,http://planner:8000,http://vision:8000,${IDENTITY_EXTRA_MODULE_URLS:-}
      # Plans (ADR 0028): the token's plan claim comes from Entitlements; this switch only
      # decides the fallback while Entitlements does not answer.
      MOWDECK_ENTITLEMENTS_BILLING_ENABLED: ${ENTITLEMENTS_BILLING_ENABLED:-false}
      # Only Traefik reaches the service, so its X-Forwarded-For is trusted. Traefik itself keeps a
      # client's X-Forwarded-For only from GATEWAY_TRUSTED_PROXIES and overwrites it otherwise.
      MOWDECK_IDENTITY_TRUST_FORWARDED_FOR: "true"
      # Which X-Forwarded-For entry is the client (GATEWAY_CLIENT_IP_DEPTH, see .env.example).
      MOWDECK_CLIENT_IP_DEPTH: ${GATEWAY_CLIENT_IP_DEPTH:-}
      # Plain HTTP in development; set to true behind HTTPS.
      MOWDECK_IDENTITY_REFRESH_COOKIE_SECURE: ${IDENTITY_REFRESH_COOKIE_SECURE:-false}
      # Passkeys (ADR 0050): the address users open MowDeck at; empty turns passkeys off.
      MOWDECK_IDENTITY_PUBLIC_URL: ${IDENTITY_PUBLIC_URL:-}
      MOWDECK_IDENTITY_PASSKEY_RP_ID: ${IDENTITY_PASSKEY_RP_ID:-}
      # Sign in with GitHub (ADR 0051), off while the client id is empty. The client secret is a
      # file in infra/compose/secrets/github/ (git-ignored, mounted below), e.g.
      # IDENTITY_GITHUB_CLIENT_SECRET_FILE=/run/secrets/github/client_secret; needs
      # IDENTITY_PUBLIC_URL (the callback URL is built from it). Never in the database or the UI.
      MOWDECK_IDENTITY_GITHUB_CLIENT_ID: ${IDENTITY_GITHUB_CLIENT_ID:-}
      MOWDECK_IDENTITY_GITHUB_CLIENT_SECRET_FILE: ${IDENTITY_GITHUB_CLIENT_SECRET_FILE:-}
      # Sign in with Apple (ADR 0052), off while the Services ID is empty. The key (.p8) is a
      # file in infra/compose/secrets/apple/ (git-ignored, mounted below), e.g.
      # IDENTITY_APPLE_PRIVATE_KEY_FILE=/run/secrets/apple/sign_in_key.p8; needs
      # IDENTITY_PUBLIC_URL (the return URL is built from it). Never in the database or the UI.
      MOWDECK_IDENTITY_APPLE_SERVICES_ID: ${IDENTITY_APPLE_SERVICES_ID:-}
      MOWDECK_IDENTITY_APPLE_TEAM_ID: ${IDENTITY_APPLE_TEAM_ID:-}
      MOWDECK_IDENTITY_APPLE_KEY_ID: ${IDENTITY_APPLE_KEY_ID:-}
      MOWDECK_IDENTITY_APPLE_PRIVATE_KEY_FILE: ${IDENTITY_APPLE_PRIVATE_KEY_FILE:-}
      MOWDECK_IDENTITY_APPLE_PKCE: ${IDENTITY_APPLE_PKCE:-true}
    volumes:
      - ./secrets/github:/run/secrets/github:ro
      - ./secrets/apple:/run/secrets/apple:ro
    # The Matter server's descriptor (profile matter) is served on the host network.
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=true
      - traefik.http.routers.identity.rule=PathPrefix(`/api/v1/identity`)
      - traefik.http.routers.identity.entrypoints=web
      - traefik.http.routers.identity.service=identity
      # Login (password, passkey, the app's hand-off code), registration and token exchange:
      # rate limited per client IP.
      # GitHub (ADR 0051) and Apple (ADR 0052): the callback finishes a login, the link start
      # checks the password.
      - traefik.http.routers.identity-auth.rule=Path(`/api/v1/identity/session`) || Path(`/api/v1/identity/register`) || Path(`/api/v1/identity/token`) || Path(`/api/v1/identity/passkeys/session`) || Path(`/api/v1/identity/app-login/session`) || Path(`/api/v1/identity/oauth/github/callback`) || Path(`/api/v1/identity/me/external-identities/github/link`) || Path(`/api/v1/identity/oauth/apple/callback`) || Path(`/api/v1/identity/me/external-identities/apple/link`)
      - traefik.http.routers.identity-auth.entrypoints=web
      - traefik.http.routers.identity-auth.priority=100
      - traefik.http.routers.identity-auth.middlewares=identity-ratelimit
      - traefik.http.routers.identity-auth.service=identity
      - traefik.http.middlewares.identity-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.identity-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.identity-ratelimit.ratelimit.burst=20
      - traefik.http.middlewares.identity-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=${GATEWAY_CLIENT_IP_DEPTH:-0}
      - traefik.http.middlewares.identity-ratelimit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      # Refresh and logout need a valid refresh cookie anyway; their own, looser limit keeps
      # several devices of a household behind one address (Tailscale, a proxy) logged in.
      - traefik.http.routers.identity-session.rule=PathPrefix(`/api/v1/identity/session/`)
      - traefik.http.routers.identity-session.entrypoints=web
      - traefik.http.routers.identity-session.priority=100
      - traefik.http.routers.identity-session.middlewares=identity-session-ratelimit
      - traefik.http.routers.identity-session.service=identity
      - traefik.http.middlewares.identity-session-ratelimit.ratelimit.average=60
      - traefik.http.middlewares.identity-session-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.identity-session-ratelimit.ratelimit.burst=30
      - traefik.http.middlewares.identity-session-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=${GATEWAY_CLIENT_IP_DEPTH:-0}
      - traefik.http.middlewares.identity-session-ratelimit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      # A passkey challenge and the app's sign-in request check nothing, and every sign-in page
      # asks for a challenge (the autofill offer): the looser session limit; the answers
      # (/passkeys/session, /app-login/session) have the login limit. So does the start of a
      # GitHub or Apple sign-in (it only hands out the provider's address); the callbacks have
      # the login limit.
      - traefik.http.routers.identity-passkey-challenge.rule=Path(`/api/v1/identity/passkeys/challenge`) || Path(`/api/v1/identity/app-login/start`) || Path(`/api/v1/identity/oauth/github/start`) || Path(`/api/v1/identity/oauth/apple/start`)
      - traefik.http.routers.identity-passkey-challenge.entrypoints=web
      - traefik.http.routers.identity-passkey-challenge.priority=101
      - traefik.http.routers.identity-passkey-challenge.middlewares=identity-session-ratelimit
      - traefik.http.routers.identity-passkey-challenge.service=identity
      - traefik.http.routers.identity-jwks.rule=Path(`/.well-known/jwks.json`)
      - traefik.http.routers.identity-jwks.entrypoints=web
      - traefik.http.routers.identity-jwks.service=identity
      - traefik.http.services.identity.loadbalancer.server.port=8000
    # The Python services are checked every 2 s while starting (start_interval within
    # start_period, so `up --wait` stays fast) and every 30 s after that: each check starts a
    # Python interpreter, which at a 5 s interval cost an idle demo host about a third of its two
    # cores (docs/ops/load-testing.md). Retries keep about the same time to "unhealthy".
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      identity-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]

  # One-shot job: Alembic migrations of the fleet database (idempotent).
  fleet-migrate:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/fleet:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/fleet/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "fleet.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://fleet:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/fleet
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Sites, groups and mowers, their place in the hierarchy (OpenFGA tuples),
  # the mower registry of the Device-Gateway (fleet.mowers.list, mower.* events)
  # and every command: checked per command kind, recorded, published.
  fleet:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/fleet:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/fleet/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: fleet
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_FLEET:?set NATS_PASSWORD_FLEET in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_DATABASE_URL: postgresql://fleet:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/fleet
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
      MOWDECK_ENTITLEMENTS_BILLING_ENABLED: ${ENTITLEMENTS_BILLING_ENABLED:-false}
      MOWDECK_ALLOWED_CONNECTION_KINDS: ${FLEET_ALLOWED_CONNECTION_KINDS:-simulated}
      # How long Fleet waits for the route a mower plans for a path preview (504 after). The
      # timeouts must stay ordered: GATEWAY_PATH_PREVIEW_TIMEOUT_SECONDS (75) <
      # FLEET_PATH_PREVIEW_REQUEST_TIMEOUT_SECONDS (85) < the web app's 90 s.
      MOWDECK_PATH_PREVIEW_REQUEST_TIMEOUT_SECONDS: ${FLEET_PATH_PREVIEW_REQUEST_TIMEOUT_SECONDS:-85}
      # Encrypts the passwords of linked Mammotion accounts (empty: no linked accounts).
      MOWDECK_CREDENTIAL_ENCRYPTION_KEY: ${FLEET_CREDENTIAL_ENCRYPTION_KEY:-}
      MOWDECK_CREDENTIAL_ENCRYPTION_KEY_PREVIOUS: ${FLEET_CREDENTIAL_ENCRYPTION_KEY_PREVIOUS:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.fleet.rule=PathPrefix(`/api/v1/fleet`)
      - traefik.http.routers.fleet.entrypoints=web
      - traefik.http.services.fleet.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      fleet-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]

  # Holds the mower connections (simulated in Phase 1), executes commands from
  # command.mower.<id> and publishes telemetry. Built from the repository root.
  device-gateway:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/device-gateway:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/device-gateway/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: device-gateway
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_DEVICE_GATEWAY:?set NATS_PASSWORD_DEVICE_GATEWAY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_SHARD_INDEX: "0"
      MOWDECK_SHARD_COUNT: "1"
      # The registry comes from Fleet (fleet.mowers.list on start, then the
      # mower.registered/updated/removed events); no mower is seeded here.
      MOWDECK_SIM_TIME_SCALE: ${MOWDECK_SIM_TIME_SCALE:-1}
      MOWDECK_TELEMETRY_HEARTBEAT_SECONDS: ${MOWDECK_TELEMETRY_HEARTBEAT_SECONDS:-10}
      # Longest time the gateway lets a mower plan a path preview; it must stay below Fleet's
      # FLEET_PATH_PREVIEW_REQUEST_TIMEOUT_SECONDS (75 < 85 < the web app's 90 s), so Fleet
      # gets the gateway's "timeout" reply instead of running into its own.
      MOWDECK_PATH_PREVIEW_TIMEOUT_SECONDS: ${GATEWAY_PATH_PREVIEW_TIMEOUT_SECONDS:-75}
      # Cloud providers (ADR 0066): untested adapters stay off until enabled here.
      MOWDECK_CLOUD_PROVIDERS_ENABLE: ${GATEWAY_CLOUD_PROVIDERS_ENABLE:-}
      MOWDECK_CLOUD_PROVIDERS_DISABLE: ${GATEWAY_CLOUD_PROVIDERS_DISABLE:-}
      # Development only: the fake clouds of the enabled providers (linked accounts and cloud
      # mowers); the former variable name still works.
      MOWDECK_FAKE_CLOUDS: ${GATEWAY_FAKE_CLOUDS:-${GATEWAY_FAKE_MAMMOTION_CLOUD:-false}}
      # Photos of real cameras (ADR 0045): the camera relay's frame tap (profile `relay`,
      # GATEWAY_RELAY_URL=http://camera-relay:8000 and the shared RELAY_FRAMES_TOKEN). It
      # reuses the session a viewer holds or starts one within the Vision limits.
      MOWDECK_RELAY_URL: ${GATEWAY_RELAY_URL:-}
      MOWDECK_RELAY_FRAMES_TOKEN: ${RELAY_FRAMES_TOKEN:-}
      # Both empty: mowers without an own photo function answer photo requests with
      # "unsupported" (AI assist then needs the camera panel's frame). The capture worker of
      # ADR 0035 (profile `capture`, MOWDECK_CAPTURE_URL) is removed. How long the relay may take
      # for one frame:
      MOWDECK_CAPTURE_TIMEOUT_SECONDS: ${CAPTURE_TIMEOUT_SECONDS:-20}
      MOWDECK_PHOTO_TIMEOUT_SECONDS: ${GATEWAY_PHOTO_TIMEOUT_SECONDS:-30}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.device-gateway.rule=PathPrefix(`/api/v1/device-gateway`)
      - traefik.http.routers.device-gateway.entrypoints=web
      - traefik.http.services.device-gateway.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
    networks: [mowdeck]

  telemetry-migrate:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/telemetry:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/telemetry/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "telemetry.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://telemetry:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/telemetry
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Latest state, de-duplicated history, position track and command timeline of
  # every mower, filled from telemetry.mower.*, command.result.mower.* and the
  # mower.* events of Fleet; retention under an advisory lock.
  telemetry:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/telemetry:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/telemetry/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: telemetry
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_TELEMETRY:?set NATS_PASSWORD_TELEMETRY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_DATABASE_URL: postgresql://telemetry:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/telemetry
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      # The public tracking page's rate limit key (GATEWAY_CLIENT_IP_DEPTH, see .env.example).
      MOWDECK_CLIENT_IP_DEPTH: ${GATEWAY_CLIENT_IP_DEPTH:-}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
      MOWDECK_TELEMETRY_HEARTBEAT_HISTORY_SECONDS: ${TELEMETRY_HEARTBEAT_HISTORY_SECONDS:-300}
      MOWDECK_TELEMETRY_RETENTION_HISTORY_DAYS: ${TELEMETRY_RETENTION_HISTORY_DAYS:-30}
      MOWDECK_TELEMETRY_RETENTION_POSITIONS_DAYS: ${TELEMETRY_RETENTION_POSITIONS_DAYS:-730}
      MOWDECK_TELEMETRY_POSITIONS_DETAIL_DAYS: ${TELEMETRY_POSITIONS_DETAIL_DAYS:-90}
      MOWDECK_TELEMETRY_MAINTENANCE_TIMEZONE: ${TELEMETRY_MAINTENANCE_TIMEZONE:-UTC}
      MOWDECK_TELEMETRY_RETENTION_COMMANDS_DAYS: ${TELEMETRY_RETENTION_COMMANDS_DAYS:-30}
      MOWDECK_TELEMETRY_BLADE_HOURS_THRESHOLD: ${TELEMETRY_BLADE_HOURS_THRESHOLD:-50}
      # Optional aerial photo under the map (ADR 0054); empty: off, no request to any third party.
      MOWDECK_TELEMETRY_AERIAL_WMS_URL: ${AERIAL_WMS_URL:-}
      MOWDECK_TELEMETRY_AERIAL_WMS_LAYER: ${AERIAL_WMS_LAYER:-}
      MOWDECK_TELEMETRY_AERIAL_IMAGE_FORMAT: ${AERIAL_IMAGE_FORMAT:-image/jpeg}
      MOWDECK_TELEMETRY_AERIAL_XYZ_URL: ${AERIAL_XYZ_URL:-}
      MOWDECK_TELEMETRY_AERIAL_ATTRIBUTION: ${AERIAL_ATTRIBUTION:-}
      MOWDECK_TELEMETRY_AERIAL_MAX_ZOOM: ${AERIAL_MAX_ZOOM:-19}
      MOWDECK_TELEMETRY_AERIAL_CACHE_MAX_MB: ${AERIAL_CACHE_MAX_MB:-256}
      # Optional street map under the theft tracking track (ADR 0058); empty: off.
      MOWDECK_TELEMETRY_BASEMAP_URL: ${BASEMAP_URL:-}
      MOWDECK_TELEMETRY_BASEMAP_ATTRIBUTION: ${BASEMAP_ATTRIBUTION:-}
      MOWDECK_TELEMETRY_BASEMAP_MAX_ZOOM: ${BASEMAP_MAX_ZOOM:-19}
      MOWDECK_TELEMETRY_BASEMAP_COVERAGE: ${BASEMAP_COVERAGE:-}
      MOWDECK_TELEMETRY_AERIAL_COVERAGE: ${AERIAL_COVERAGE:-}
    volumes:
      - aerial-cache:/var/cache/mowdeck/aerial
    labels:
      - traefik.enable=true
      - traefik.http.routers.telemetry.rule=PathPrefix(`/api/v1/telemetry`)
      - traefik.http.routers.telemetry.entrypoints=web
      - traefik.http.services.telemetry.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      telemetry-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]

  # Live mower state and command results over WebSocket (/api/v1/realtime/ws).
  # The access token travels in the first message, never in the URL. Every
  # instance subscribes to telemetry.mower.* and command.result.mower.* without a
  # queue group, so replicas need no sticky sessions. Traefik passes the
  # WebSocket upgrade through without extra configuration; uvicorn's protocol
  # pings (MOWDECK_REALTIME_PING_SECONDS) keep idle sockets open through it.
  realtime:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/realtime:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/realtime/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: realtime
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_REALTIME:?set NATS_PASSWORD_REALTIME in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
      MOWDECK_ENTITLEMENTS_BILLING_ENABLED: ${ENTITLEMENTS_BILLING_ENABLED:-false}
      MOWDECK_REALTIME_PING_SECONDS: ${REALTIME_PING_SECONDS:-20}
      MOWDECK_REALTIME_MAX_CONNECTIONS_PER_ACCOUNT: ${REALTIME_MAX_CONNECTIONS_PER_ACCOUNT:-50}
      MOWDECK_REALTIME_MAX_CONNECTIONS_PER_USER: ${REALTIME_MAX_CONNECTIONS_PER_USER:-10}
      # The web app is served from the same origin (service web); other origins are refused.
      MOWDECK_REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost}
      MOWDECK_REALTIME_DRIVE_MAX_SECONDS: ${REALTIME_DRIVE_MAX_SECONDS:-600}
    labels:
      - traefik.enable=true
      - traefik.http.routers.realtime.rule=PathPrefix(`/api/v1/realtime`)
      - traefik.http.routers.realtime.entrypoints=web
      - traefik.http.services.realtime.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]

  # One-shot job: Alembic migrations of the notifications database (idempotent).
  notifications-migrate:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/notifications:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/notifications/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "notifications.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://notifications:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/notifications
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Derives notifications (mowing finished, stuck, battery low, offline) from
  # telemetry.mower.* and the mower.* events, keeps each user's inbox and
  # delivers by Web Push, APNs (iOS app), ntfy or the log (outbox worker on
  # every replica).
  # Without NOTIFICATIONS_VAPID_PRIVATE_KEY a development key pair is created in
  # the notifications-data volume on first start and its public key is logged;
  # production sets the keys explicitly (python -m notifications.cli
  # generate-vapid-keys). APNs: put AuthKey_<KEY_ID>.p8 into
  # infra/compose/secrets/apns/ (git-ignored) and set APNS_KEY_FILE,
  # APNS_KEY_ID and APNS_TEAM_ID; without them the apns channel stays off.
  notifications:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/notifications:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/notifications/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - notifications-data:/var/lib/notifications
      - ./secrets/apns:/run/secrets/apns:ro
    environment:
      <<: *source-code
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
