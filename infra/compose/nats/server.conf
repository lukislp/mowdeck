# NATS server of the Compose stack: the users and permissions of auth.conf (generated, ADR 0074)
# plus internal TLS (docs/ops/internal-tls.md). Every client connects with TLS and checks the
# server's certificate against the stack's private CA (tls-init); the passwords authenticate
# the clients.

include auth.conf

tls {
  cert_file: "/etc/mowdeck/tls/nats/tls.crt"
  key_file: "/etc/mowdeck/tls/nats/tls.key"
  min_version: "1.2"
  timeout: 2
}

# Monitoring (/healthz for the health check, /varz) on the container's loopback only.
http: "127.0.0.1:8222"
