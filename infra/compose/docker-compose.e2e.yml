# Override for throwaway test stacks (the Playwright suite tests/e2e-web and the acceptance test
# tests/e2e). Use it on top of docker-compose.yml, never on its own:
#
#   docker compose -p mowdeck-e2e -f docker-compose.yml -f docker-compose.e2e.yml ...
#
# Locally `pnpm e2e:stack up` does this with its own project name, host ports, network, image tag
# and env files (tests/e2e-web/scripts/stack.mjs); CI adds the file to its stack.
#
# It adds a marker that the test suites check before they create any data. The marker answers at
# /api/v1/e2e-stack with the Compose project name as its host name, so a suite pointed at a stack
# without this override (the stack you actually use) refuses to run, and the suite knows which
# project to `docker exec` into. It also enables the camera relay (ADR 0045) with its test hooks.

services:
  e2e-marker:
    image: ${WHOAMI_IMAGE:-ghcr.io/traefik/whoami:v1.10.3}
    hostname: ${COMPOSE_PROJECT_NAME}
    labels:
      - traefik.enable=true
      - traefik.http.routers.e2e-marker.rule=PathPrefix(`/api/v1/e2e-stack`)
      - traefik.http.routers.e2e-marker.entrypoints=web
      - traefik.http.routers.e2e-marker.middlewares=e2e-marker-strip
      - traefik.http.middlewares.e2e-marker-strip.stripprefix.prefixes=/api/v1/e2e-stack
      - traefik.http.services.e2e-marker.loadbalancer.server.port=80
    networks: [mowdeck]

  # The whole Playwright suite registers and logs in its users from one address, which runs into
  # the per-address limit of Identity's login and registration routes (10 per minute, burst 20)
  # once the suite grows. Test stacks only: a looser limit of the same middleware and of
  # Identity's own per-address limit behind it (the same 10 per minute, burst 20, applied
  # in-process to logins, passkey and GitHub sign-ins, app hand-offs and token exchanges), so the
  # specs never fail with 429 for each other and need not wait for it to refill. Production keeps
  # the defaults of docker-compose.yml and Identity's settings.
  #
  # Sign in with GitHub (ADR 0051) against the fake GitHub below: the browser goes to its
  # authorization page through Traefik at the stack's own address, Identity calls its token and
  # API endpoints inside the network. The client secret is a test value from a file, as in
  # production (tests/e2e-web/fake-github/client_secret).
  identity:
    labels:
      - traefik.http.middlewares.identity-ratelimit.ratelimit.average=300
      - traefik.http.middlewares.identity-ratelimit.ratelimit.burst=100
    environment:
      MOWDECK_IDENTITY_LOGIN_IP_PER_MINUTE: "300"
      MOWDECK_IDENTITY_LOGIN_IP_BURST: "100"
      MOWDECK_IDENTITY_GITHUB_CLIENT_ID: e2e-github-client
      MOWDECK_IDENTITY_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github-e2e/client_secret
      MOWDECK_IDENTITY_GITHUB_AUTHORIZE_URL: ${IDENTITY_PUBLIC_URL:-http://localhost}/fake-github/login/oauth/authorize
      MOWDECK_IDENTITY_GITHUB_TOKEN_URL: http://fake-github:8000/fake-github/login/oauth/access_token
      MOWDECK_IDENTITY_GITHUB_API_URL: http://fake-github:8000/fake-github/api
      # Sign in with Apple (ADR 0052) against the fake Apple below, which generates the key
      # (.p8) into a volume; the same environment variable names as in production.
      MOWDECK_IDENTITY_APPLE_SERVICES_ID: app.mowdeck.e2e
      MOWDECK_IDENTITY_APPLE_TEAM_ID: E2ETEAM123
      MOWDECK_IDENTITY_APPLE_KEY_ID: E2EKEY1234
      MOWDECK_IDENTITY_APPLE_PRIVATE_KEY_FILE: /run/secrets/apple-e2e/sign_in_key.p8
      MOWDECK_IDENTITY_APPLE_AUTHORIZE_URL: ${IDENTITY_PUBLIC_URL:-http://localhost}/fake-apple/auth/authorize
      MOWDECK_IDENTITY_APPLE_TOKEN_URL: http://fake-apple:8000/fake-apple/auth/token
      MOWDECK_IDENTITY_APPLE_KEYS_URL: http://fake-apple:8000/fake-apple/auth/keys
    volumes:
      - ../../tests/e2e-web/fake-github:/run/secrets/github-e2e:ro
      - fake-apple-keys:/run/secrets/apple-e2e:ro
    depends_on:
      fake-apple:
        condition: service_healthy

  # A fake GitHub (OAuth App endpoints and GET /user; tests/e2e-web/fake-github/fake_github.py,
  # standard library only) in the identity image, which the stack builds anyway.
  fake-github:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/identity:${MOWDECK_VERSION:-dev}
    pull_policy: never
    command: ["python", "/fake/fake_github.py"]
    read_only: true
    environment:
      FAKE_GITHUB_CLIENT_ID: e2e-github-client
      FAKE_GITHUB_CLIENT_SECRET_FILE: /fake/client_secret
    volumes:
      - ../../tests/e2e-web/fake-github:/fake:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/fake-github/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.http.routers.fake-github.rule=PathPrefix(`/fake-github`)
      - traefik.http.routers.fake-github.entrypoints=web
      - traefik.http.services.fake-github.loadbalancer.server.port=8000
    networks: [mowdeck]

  # A fake Apple (Sign in with Apple endpoints; tests/e2e-web/fake-apple/fake_apple.py, PyJWT and
  # cryptography from the identity image). It generates the key pair of the stack at startup
  # into the fake-apple-keys volume (root, so it may write there; Identity mounts it read-only)
  # and is healthy once the .p8 exists, which Identity waits for.
  fake-apple:
    image: ${MOWDECK_IMAGE_REGISTRY:-mowdeck}/identity:${MOWDECK_VERSION:-dev}
    pull_policy: never
    user: "0:0"
    command: ["python", "/fake/fake_apple.py"]
    read_only: true
    environment:
      FAKE_APPLE_SERVICES_ID: app.mowdeck.e2e
      FAKE_APPLE_TEAM_ID: E2ETEAM123
      FAKE_APPLE_KEY_ID: E2EKEY1234
      FAKE_APPLE_KEY_DIR: /keys
    volumes:
      - ../../tests/e2e-web/fake-apple:/fake:ro
      - fake-apple-keys:/keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/fake-apple/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.http.routers.fake-apple.rule=PathPrefix(`/fake-apple`)
      - traefik.http.routers.fake-apple.entrypoints=web
      - traefik.http.services.fake-apple.loadbalancer.server.port=8000
    networks: [mowdeck]

  # The camera relay and its media server run in every test stack (they are the "relay"
  # profile otherwise), with the test hooks of the relay (POST /internal/v1/test/freeze pauses
  # the fake source), so the suites can play the simulator's cameras through the relay.
  camera-relay:
    profiles: !reset []
    environment:
      MOWDECK_RELAY_TEST_HOOKS: "true"

  mediamtx:
    profiles: !reset []

volumes:
  # The key pair the fake Apple generates for this stack (see fake-apple).
  fake-apple-keys:
