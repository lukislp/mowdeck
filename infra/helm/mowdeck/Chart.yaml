# MowDeck umbrella chart: every MowDeck service, the web app, the migration and authorization
# bootstrap jobs, an Ingress, and (optionally) NATS, OpenFGA and an in-cluster PostgreSQL
# (CloudNativePG Cluster). Operations manual: docs/ops/helm.md; decision: ADR 0029.
apiVersion: v2
name: mowdeck
description: Self-hosted multi-tenant platform for Mammotion robotic mowers (services, web app, jobs)
type: application
# Chart and application share one version line. The release workflow sets both from the tag
# (v0.1.0 -> version 0.1.0, appVersion 0.1.0); image.tag defaults to appVersion.
version: 0.1.0-dev
appVersion: "0.1.0-dev"
kubeVersion: ">=1.29.0-0"
home: https://github.com/lukislp/mowdeck
sources:
  - https://github.com/lukislp/mowdeck
keywords:
  - mowdeck
  - mammotion
  - robotic-mower
annotations:
  artifacthub.io/license: AGPL-3.0-only
dependencies:
  # Official NATS chart (JetStream with file storage); disable to use an external NATS cluster.
  - name: nats
    version: 2.15.0
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  # Official OpenFGA chart with the postgres datastore; disable to use an external OpenFGA.
  - name: openfga
    version: 0.3.16
    repository: https://openfga.github.io/helm-charts
    condition: openfga.enabled
