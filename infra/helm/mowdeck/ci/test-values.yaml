# Not secret and not usable anywhere: never copy them into an installation.
secrets:
  OPENFGA_AUTHN_PRESHARED_KEYS: ci-placeholder-openfga-key
  IDENTITY_KEY_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXIta2V5LW5vdC1hLXNlY3JldDA=
  SERVICE_DB_PASSWORD: ci-placeholder-db-password
  NOTIFICATIONS_VAPID_PRIVATE_KEY: ci-placeholder-vapid-key
  BILLING_STRIPE_SECRET_KEY: sk_test_ci_placeholder
  BILLING_STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  RELAY_FRAMES_TOKEN: ci-placeholder-relay-frames-token
  MATTER_API_TOKENS: ci-placeholder-matter-api-token
  NATS_PASSWORD_BILLING: ci-placeholder-nats-billing-password
  NATS_PASSWORD_CAMERA_RELAY: ci-placeholder-nats-camera-relay-password
  NATS_PASSWORD_DEVICE_GATEWAY: ci-placeholder-nats-device-gateway-password
  NATS_PASSWORD_ENTITLEMENTS: ci-placeholder-nats-entitlements-password
  NATS_PASSWORD_FLEET: ci-placeholder-nats-fleet-password
  NATS_PASSWORD_IDENTITY: ci-placeholder-nats-identity-password
  NATS_PASSWORD_NOTIFICATIONS: ci-placeholder-nats-notifications-password
  NATS_PASSWORD_PLANNER: ci-placeholder-nats-planner-password
  NATS_PASSWORD_REALTIME: ci-placeholder-nats-realtime-password
  NATS_PASSWORD_SCHEDULER: ci-placeholder-nats-scheduler-password
  NATS_PASSWORD_STREAMS: ci-placeholder-nats-streams-password
  NATS_PASSWORD_TELEMETRY: ci-placeholder-nats-telemetry-password
  NATS_PASSWORD_VISION: ci-placeholder-nats-vision-password
# Documentation address (RFC 5737): renders MediaMTX's MTX_WEBRTCADDITIONALHOSTS.
config:
  RELAY_ICE_HOSTS: 192.0.2.10
  # Rendered only when set (otherwise the images' own value): set here so the CI render checks it.
  SOURCE_URL: https://github.com/lukislp/mowdeck
  # One proxy in front of the controller: the services and the rate limit below get the depth.
  GATEWAY_CLIENT_IP_DEPTH: "1"
# Billing, the camera relay, the Matter server and the assistant are off by default; the CI render
# enables them so their templates are linted and checked.
services:
  assistant:
    enabled: true
  billing:
    enabled: true
  cameraRelay:
    enabled: true
  matterServer:
    enabled: true
ingress:
  host: mowdeck.example.org
  # Renders the Traefik Middleware of the -media Ingress, so kubeconform checks it too.
  media:
    traefikStripPrefix: true
  # Renders the Traefik rate limit Middleware of the -auth Ingress for kubeconform as well.
  auth:
    traefikRateLimit:
      enabled: true
  tls:
    - secretName: mowdeck-tls
      hosts: [mowdeck.example.org]
