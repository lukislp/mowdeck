{{- /* Camera relay (ADR 0045): shared camera sessions per account and mower, leases with a
grace period, tickets and the lifecycle events on the stream CAMERA (Compose service
camera-relay, profile "relay"). Off by default (services.cameraRelay.enabled=false): the media
plane and the source drivers follow in later steps, until then every attach is "unavailable".
Internal only: answers relay.camera.* on NATS, no Ingress route. State lives in memory, so it
runs as a single replica. */ -}}
{{- $env := include "mowdeck.commonEnv" . | fromJson }}
{{- include "mowdeck.workload" (dict "ctx" . "component" "camera-relay" "key" "cameraRelay" "image" "camera-relay"
  "env" $env) }}
