{{- /*
Secrets created by the chart (never with default values: every required value fails the render
with a message unless it is given or an existing Secret is named).

  <fullname>-secrets   application secrets, mounted as files (unless secrets.existingSecret);
                       with services.billing.enabled also the Stripe keys
  <fullname>-migrate   copy of the database URLs for the migration hooks (hook mode only:
                       pre-install hooks run before the ordinary resources exist)
  openfgaSecret.name   pre-shared keys ("keys") and datastore URI ("uri") of the OpenFGA subchart
*/ -}}
{{- $s := .Values.secrets }}
{{- $dbServices := list "identity" "fleet" "telemetry" "notifications" "scheduler" "entitlements" "billing" "planner" "vision" }}
{{- $presharedKeys := $s.OPENFGA_AUTHN_PRESHARED_KEYS }}
{{- if not $s.existingSecret }}
{{- $apiToken := $s.OPENFGA_API_TOKEN }}
{{- if not $apiToken }}
{{- $presharedKeys = required "secrets.OPENFGA_AUTHN_PRESHARED_KEYS is required: give it with --set (or name an existing Secret in secrets.existingSecret)" $presharedKeys }}
{{- if contains "," $presharedKeys }}
{{- fail "secrets.OPENFGA_AUTHN_PRESHARED_KEYS has several keys: set secrets.OPENFGA_API_TOKEN to the one the services use" }}
{{- end }}
{{- $apiToken = $presharedKeys }}
{{- end }}
{{- $kek := required "secrets.IDENTITY_KEY_ENCRYPTION_KEY is required: generate one (docs/ops/helm.md) and give it with --set, or name an existing Secret in secrets.existingSecret" $s.IDENTITY_KEY_ENCRYPTION_KEY }}
{{- $dbUrls := dict }}
{{- range $dbServices }}
{{- if (index $.Values.services .).enabled }}
{{- $_ := set $dbUrls (printf "database-url-%s" .) (include "mowdeck.pg.serviceUrl" (dict "ctx" $ "db" .)) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mowdeck.secretName" . }}
  labels:
    {{- include "mowdeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  openfga-api-token: {{ $apiToken | quote }}
  identity-key-encryption-key: {{ $kek | quote }}
  {{- with $s.NOTIFICATIONS_VAPID_PRIVATE_KEY }}
  notifications-vapid-private-key: {{ . | quote }}
  {{- end }}
  {{- range $k, $url := $dbUrls }}
  {{ $k }}: {{ $url | quote }}
  {{- end }}
  {{- if .Values.services.billing.enabled }}
  {{- if eq .Values.config.BILLING_PROVIDER "stripe" }}
  billing-stripe-secret-key: {{ required "secrets.BILLING_STRIPE_SECRET_KEY is required when services.billing.enabled with the stripe provider (or name an existing Secret in secrets.existingSecret)" $s.BILLING_STRIPE_SECRET_KEY | quote }}
  {{- else }}
  billing-stripe-secret-key: {{ $s.BILLING_STRIPE_SECRET_KEY | quote }}
  {{- end }}
  billing-stripe-webhook-secret: {{ $s.BILLING_STRIPE_WEBHOOK_SECRET | quote }}
  {{- end }}
  fleet-credential-encryption-key: {{ $s.FLEET_CREDENTIAL_ENCRYPTION_KEY | quote }}
  fleet-credential-encryption-key-previous: {{ $s.FLEET_CREDENTIAL_ENCRYPTION_KEY_PREVIOUS | quote }}
  {{- if .Values.services.vision.enabled }}
  vision-secrets-key: {{ $s.VISION_SECRETS_KEY | quote }}
  vision-default-api-key: {{ $s.VISION_DEFAULT_API_KEY | quote }}
  {{- end }}
  {{- if .Values.services.visionCapture.enabled }}
  capture-token: {{ $s.CAPTURE_TOKEN | quote }}
  {{- end }}
{{- if include "mowdeck.migrations.asHook" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mowdeck.fullname" . }}-migrate
  labels:
    {{- include "mowdeck.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $url := $dbUrls }}
  {{ $k }}: {{ $url | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.openfga.enabled .Values.openfgaSecret.create }}
{{- $fga := .Values.openfga }}
{{- if or (ne $fga.authn.preshared.keysSecret .Values.openfgaSecret.name) (ne $fga.datastore.uriSecret .Values.openfgaSecret.name) }}
{{- fail (printf "openfga.authn.preshared.keysSecret and openfga.datastore.uriSecret must both be %q (openfgaSecret.name)" .Values.openfgaSecret.name) }}
{{- end }}
{{- $db := .Values.postgresql.databases.openfga }}
{{- $uri := printf "postgres://%s:%s@%s:%s/%s" (urlquery $db.user) (urlquery (include "mowdeck.pg.password" (dict "ctx" . "db" "openfga"))) (include "mowdeck.pg.host" .) (include "mowdeck.pg.port" .) $db.name }}
{{- with .Values.postgresql.openfgaUriParams }}{{ $uri = printf "%s?%s" $uri . }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.openfgaSecret.name }}
  labels:
    {{- include "mowdeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  keys: {{ required "secrets.OPENFGA_AUTHN_PRESHARED_KEYS is required for the OpenFGA subchart: give it with --set (or set openfgaSecret.create=false and create the Secret yourself)" $presharedKeys | quote }}
  uri: {{ $uri | quote }}
{{- end }}
