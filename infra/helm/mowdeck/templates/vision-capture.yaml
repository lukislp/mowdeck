{{- /* Capture worker (ADR 0035): still frames of live cameras without an open browser, for AI
assist and the automatic analysis on errors. The Vision image built with WITH_CAPTURE=true
(image vision-capture: Playwright, the Chromium headless shell, the Agora Web SDK), started with
"python -m vision.capture". Off by default (Compose: the "capture" profile); the Device-Gateway
uses it when enabled. Internal only: no Ingress route. */ -}}
{{- $c := .Values.config }}
{{- $env := merge (include "mowdeck.commonEnv" . | fromJson) (dict
  "MOWDECK_NATS_ENABLED" "false"
  "HOME" "/tmp"
  "MOWDECK_CAPTURE_MAX_CONCURRENCY" (toString $c.CAPTURE_MAX_CONCURRENCY)
  "MOWDECK_CAPTURE_BROWSER_CHANNEL" $c.CAPTURE_BROWSER_CHANNEL) }}
{{- include "mowdeck.workload" (dict "ctx" . "component" "vision-capture" "key" "visionCapture" "image" "vision-capture"
  "env" $env "command" (list "python" "-m" "vision.capture") "tmpSizeLimit" "512Mi"
  "secretFiles" (list
    (dict "key" "capture-token" "file" "capture-token" "env" "MOWDECK_CAPTURE_TOKEN_FILE"))) }}
