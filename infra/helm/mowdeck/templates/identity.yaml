{{- /* Identity: accounts, users, roles, sessions, API tokens; issues the access tokens and
publishes /.well-known/jwks.json (Compose services identity and identity-migrate). */ -}}
{{- $c := .Values.config }}
{{- $modules := list }}
{{- range list "device-gateway" "fleet" "telemetry" "realtime" "notifications" "scheduler" "entitlements" "planner" "vision" }}
{{- $modules = append $modules (include "mowdeck.serviceUrl" (dict "ctx" $ "component" .)) }}
{{- end }}
{{- /* The Matter server (ADR 0063) when enabled, plus config.IDENTITY_EXTRA_MODULE_URLS. */ -}}
{{- if .Values.services.matterServer.enabled }}
{{- $modules = append $modules (printf "http://%s:%s" (include "mowdeck.serviceName" (dict "ctx" . "component" "matter-server")) (toString $c.MATTER_HTTP_PORT)) }}
{{- end }}
{{- with $c.IDENTITY_EXTRA_MODULE_URLS }}
{{- $modules = append $modules . }}
{{- end }}
{{- $env := merge (include "mowdeck.commonEnv" . | fromJson) (include "mowdeck.authzEnv" . | fromJson) (include "mowdeck.billingEnv" . | fromJson) (dict
  "MOWDECK_IDENTITY_REGISTRATION" $c.IDENTITY_REGISTRATION
  "MOWDECK_IDENTITY_ARGON2_PROFILE" $c.IDENTITY_ARGON2_PROFILE
  "MOWDECK_IDENTITY_MODULE_URLS" (join "," $modules)
  "MOWDECK_IDENTITY_TRUST_FORWARDED_FOR" "true"
  "MOWDECK_CLIENT_IP_DEPTH" (include "mowdeck.clientIpDepth" .)
  "MOWDECK_IDENTITY_REFRESH_COOKIE_SECURE" $c.IDENTITY_REFRESH_COOKIE_SECURE
  "MOWDECK_IDENTITY_PUBLIC_URL" (default (include "mowdeck.publicOrigin" .) $c.IDENTITY_PUBLIC_URL)
  "MOWDECK_IDENTITY_PASSKEY_RP_ID" (default "" $c.IDENTITY_PASSKEY_RP_ID)) }}
{{- /* Sign in with GitHub (ADR 0051): the settings are always rendered (empty means off), the
client secret file only when enabled, from its own Secret. */ -}}
{{- $v := .Values.services.identity }}
{{- $github := $v.github }}
{{- $_ := set $env "MOWDECK_IDENTITY_GITHUB_CLIENT_ID" "" }}
{{- $_ := set $env "MOWDECK_IDENTITY_GITHUB_CLIENT_SECRET_FILE" "" }}
{{- $githubVolumes := list }}
{{- $githubMounts := list }}
{{- if and $v.enabled $github.enabled }}
{{- $secret := required "services.identity.github.existingSecret is required when github.enabled (a Secret with the OAuth App's client secret)" $github.existingSecret }}
{{- $clientId := required "services.identity.github.clientId is required when github.enabled" $github.clientId }}
{{- $_ := set $env "MOWDECK_IDENTITY_GITHUB_CLIENT_ID" $clientId }}
{{- $_ := set $env "MOWDECK_IDENTITY_GITHUB_CLIENT_SECRET_FILE" (printf "/run/secrets/github/%s" $github.secretKey) }}
{{- $githubVolumes = list (dict "name" "github-client-secret" "secret" (dict "secretName" $secret "defaultMode" 288 "items" (list (dict "key" $github.secretKey "path" $github.secretKey)))) }}
{{- $githubMounts = list (dict "name" "github-client-secret" "mountPath" "/run/secrets/github" "readOnly" true) }}
{{- end }}
{{- /* Sign in with Apple (ADR 0052): the same, with the key (.p8) as the secret file. */ -}}
{{- $apple := $v.apple }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_SERVICES_ID" "" }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_TEAM_ID" "" }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_KEY_ID" "" }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_PRIVATE_KEY_FILE" "" }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_PKCE" (ternary "true" "false" (ne (toString $apple.pkce) "false")) }}
{{- if and $v.enabled $apple.enabled }}
{{- $appleSecret := required "services.identity.apple.existingSecret is required when apple.enabled (a Secret with the Sign in with Apple key, the .p8 file)" $apple.existingSecret }}
{{- $servicesId := required "services.identity.apple.servicesId is required when apple.enabled" $apple.servicesId }}
{{- $teamId := required "services.identity.apple.teamId is required when apple.enabled" $apple.teamId }}
{{- $keyId := required "services.identity.apple.keyId is required when apple.enabled" $apple.keyId }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_SERVICES_ID" $servicesId }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_TEAM_ID" $teamId }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_KEY_ID" $keyId }}
{{- $_ := set $env "MOWDECK_IDENTITY_APPLE_PRIVATE_KEY_FILE" (printf "/run/secrets/apple/%s" $apple.secretKey) }}
{{- $githubVolumes = append $githubVolumes (dict "name" "apple-sign-in-key" "secret" (dict "secretName" $appleSecret "defaultMode" 288 "items" (list (dict "key" $apple.secretKey "path" $apple.secretKey)))) }}
{{- $githubMounts = append $githubMounts (dict "name" "apple-sign-in-key" "mountPath" "/run/secrets/apple" "readOnly" true) }}
{{- end }}
{{- include "mowdeck.migrationJob" (dict "ctx" . "component" "identity" "key" "identity" "image" "identity" "module" "identity.adapters.db.migrate" "weight" 1) }}
{{- include "mowdeck.workload" (dict "ctx" . "component" "identity" "key" "identity" "image" "identity"
  "env" $env "db" "identity" "migrateModule" "identity.adapters.db.migrate" "authz" true
  "secretFiles" (list
    (dict "key" "database-url-identity" "file" "database-url" "env" "MOWDECK_DATABASE_URL_FILE")
    (dict "key" "openfga-api-token" "file" "openfga-api-token" "env" "MOWDECK_OPENFGA_API_TOKEN_FILE")
    (dict "key" "identity-key-encryption-key" "file" "identity-key-encryption-key" "env" "MOWDECK_IDENTITY_KEY_ENCRYPTION_KEY_FILE"))
  "volumes" $githubVolumes "volumeMounts" $githubMounts) }}
