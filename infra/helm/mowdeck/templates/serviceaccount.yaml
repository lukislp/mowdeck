{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mowdeck.serviceAccountName" . }}
  labels:
    {{- include "mowdeck.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# MowDeck pods never talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
