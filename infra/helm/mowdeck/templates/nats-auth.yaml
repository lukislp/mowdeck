{{- /*
NATS users and permissions (ADR 0074; Compose: nats/auth.conf). The ConfigMap
natsAuth.configMapName holds files/nats-auth.conf (generated by
tools/repo-checks/scripts/nats_auth.py), which the NATS server of the subchart includes
(nats.config.merge, nats.podTemplate.patch). With an external NATS (nats.enabled=false)
configure the users there yourself. The Secret natsAuth.secretName (below, unless
natsAuth.createSecret=false) holds the passwords.
*/ -}}
{{- if .Values.nats.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.natsAuth.configMapName }}
  labels:
    {{- include "mowdeck.componentLabels" (dict "ctx" . "component" "nats-auth") | nindent 4 }}
data:
  auth.conf: |-
    {{- .Files.Get "files/nats-auth.conf" | trimSuffix "\n" | nindent 4 }}
{{- end }}
{{- if .Values.natsAuth.createSecret }}
{{- /* One NATS password per user (ADR 0074), read by the NATS server and, each its own, by the
services and the nats-streams Job. The server takes a password from its environment as a
configuration value, so it must start with a letter. */}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.natsAuth.secretName }}
  labels:
    {{- include "mowdeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $user := include "mowdeck.natsUsers" . | fromJsonArray }}
  {{- $key := printf "NATS_PASSWORD_%s" ($user | upper | replace "-" "_") }}
  {{- $password := required (printf "secrets.%s is required (one NATS password per user, ADR 0074): generate it (docs/ops/helm.md) and give it with --set, or set natsAuth.createSecret=false and create the Secret %s yourself" $key $.Values.natsAuth.secretName) (index $.Values.secrets $key) }}
  {{- if not (regexMatch "^[A-Za-z][A-Za-z0-9_-]{23,127}$" $password) }}
  {{- fail (printf "secrets.%s must be 24 to 128 letters, digits, '-' and '_' and start with a letter" $key) }}
  {{- end }}
  {{ $user }}: {{ $password | quote }}
  {{- end }}
{{- end }}
