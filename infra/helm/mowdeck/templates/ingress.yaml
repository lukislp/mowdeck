{{- /*
Ingress with the path routes of the Compose Traefik labels:
  /api/v1/<service>       each API service (Prefix)
  /.well-known/jwks.json  Identity (Exact)
  /                       the web app (Prefix; the longest matching path wins, so it comes last)
plus a second Ingress for the login, registration, token and refresh paths of Identity (and the
Stripe webhook of Billing when it is enabled), so a rate limit can be attached to them alone
(ingress.auth.annotations).
*/ -}}
{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
{{- $routes := list }}
{{- range $component, $key := dict "identity" "identity" "fleet" "fleet" "device-gateway" "deviceGateway" "telemetry" "telemetry" "realtime" "realtime" "notifications" "notifications" "scheduler" "scheduler" "entitlements" "entitlements" "billing" "billing" "planner" "planner" "vision" "vision" }}
{{- if (index $.Values.services $key).enabled }}
{{- $routes = append $routes (dict "path" (printf "/api/v1/%s" $component) "type" "Prefix" "component" $component "port" 8000) }}
{{- end }}
{{- end }}
{{- if .Values.services.matterServer.enabled }}
{{- /* Matter server (ADR 0063): its admin API on config.MATTER_HTTP_PORT. */ -}}
{{- $routes = append $routes (dict "path" "/api/v1/matter" "type" "Prefix" "component" "matter-server" "port" (int .Values.config.MATTER_HTTP_PORT)) }}
{{- end }}
{{- if .Values.services.identity.enabled }}
{{- $routes = append $routes (dict "path" "/.well-known/jwks.json" "type" "Exact" "component" "identity" "port" 8000) }}
{{- end }}
{{- if .Values.services.web.enabled }}
{{- $routes = append $routes (dict "path" "/" "type" "Prefix" "component" "web" "port" 8080) }}
{{- end }}
{{- $ingresses := list (dict "suffix" "" "annotations" $ing.annotations "routes" $routes) }}
{{- if and $ing.auth.enabled .Values.services.identity.enabled }}
{{- $auth := list }}
{{- range list "/api/v1/identity/session" "/api/v1/identity/register" "/api/v1/identity/token" }}
{{- $auth = append $auth (dict "path" . "type" "Exact" "component" "identity" "port" 8000) }}
{{- end }}
{{- $auth = append $auth (dict "path" "/api/v1/identity/session/" "type" "Prefix" "component" "identity" "port" 8000) }}
{{- /* Passkey login and the app hand-off (ADR 0050); the challenge stays on the main Ingress. */ -}}
{{- $auth = append $auth (dict "path" "/api/v1/identity/passkeys/session" "type" "Exact" "component" "identity" "port" 8000) }}
{{- $auth = append $auth (dict "path" "/api/v1/identity/app-login/session" "type" "Exact" "component" "identity" "port" 8000) }}
{{- /* GitHub (ADR 0051): the callback finishes a login, the link start checks the password; the
start of a sign-in stays on the main Ingress like the passkey challenge. */ -}}
{{- $auth = append $auth (dict "path" "/api/v1/identity/oauth/github/callback" "type" "Exact" "component" "identity" "port" 8000) }}
{{- $auth = append $auth (dict "path" "/api/v1/identity/me/external-identities/github/link" "type" "Exact" "component" "identity" "port" 8000) }}
{{- /* Apple (ADR 0052): the same two paths. */ -}}
{{- $auth = append $auth (dict "path" "/api/v1/identity/oauth/apple/callback" "type" "Exact" "component" "identity" "port" 8000) }}
{{- $auth = append $auth (dict "path" "/api/v1/identity/me/external-identities/apple/link" "type" "Exact" "component" "identity" "port" 8000) }}
{{- if .Values.services.billing.enabled }}
{{- /* Stripe webhooks carry no token: rate limited like the login routes. */ -}}
{{- $auth = append $auth (dict "path" "/api/v1/billing/webhooks/stripe" "type" "Exact" "component" "billing" "port" 8000) }}
{{- end }}
{{- $ingresses = append $ingresses (dict "suffix" "-auth" "annotations" (merge (dict) $ing.auth.annotations $ing.annotations) "routes" $auth) }}
{{- end }}
{{- if .Values.services.cameraRelay.enabled }}
{{- $media := list (dict "path" $ing.media.path "type" $ing.media.pathType "component" "mediamtx" "portName" "webrtc") }}
{{- $strip := dict }}
{{- if $ing.media.traefikStripPrefix }}
{{- $_ := set $strip "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-media-strip@kubernetescrd" .Release.Namespace (include "mowdeck.fullname" .)) }}
---
# Traefik: strips /media/whep before the request reaches MediaMTX (ingress.media.traefikStripPrefix).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "mowdeck.fullname" . }}-media-strip
  labels:
    {{- include "mowdeck.componentLabels" (dict "ctx" . "component" "ingress") | nindent 4 }}
spec:
  stripPrefix:
    prefixes: [/media/whep]
{{- end }}
{{- $ingresses = append $ingresses (dict "suffix" "-media" "annotations" (merge (dict) $ing.media.annotations $strip $ing.annotations) "routes" $media) }}
{{- end }}
{{- range $ingresses }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mowdeck.fullname" $ }}{{ .suffix }}
  labels:
    {{- include "mowdeck.componentLabels" (dict "ctx" $ "component" "ingress") | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with $ing.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range .routes }}
          - path: {{ .path }}
            pathType: {{ .type }}
            backend:
              service:
                name: {{ include "mowdeck.serviceName" (dict "ctx" $ "component" .component) }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
{{- end }}
{{- end }}
