[project]
name = "entitlements"
version = "0.1.0"
description = "Plans, limits and feature gates: answers whether an account may use a feature."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-auth",
  "mowdeck-authz[fastapi]",
  "mowdeck-contracts",
  "mowdeck-service-kit[db]",
  "alembic>=1.16.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0.2",
]

[project.scripts]
entitlements = "entitlements.main:main"
entitlements-migrate = "entitlements.adapters.db.migrate:main"

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-authz = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entitlements"]
