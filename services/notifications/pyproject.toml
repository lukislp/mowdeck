[project]
name = "notifications"
version = "0.1.0"
description = "Turns mower states into notifications and delivers them by Web Push, APNs, ntfy or other channels."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-auth",
  "mowdeck-authz[fastapi]",
  "mowdeck-contracts",
  "mowdeck-service-kit[db]",
  "alembic>=1.16.0",
  # APNs only speaks HTTP/2 (h2) and needs an ES256 provider token (PyJWT with cryptography).
  "httpx[http2]>=0.28.1",
  "pyjwt[crypto]>=2.10.1",
  "py-vapid>=1.9.4",
  "pywebpush>=2.5.0",
  # IANA time zones for quiet hours (the slim image has no system zoneinfo).
  "tzdata>=2025.2",
]

[project.scripts]
notifications = "notifications.main:main"
notifications-migrate = "notifications.adapters.db.migrate:main"

# Delivery channels; a third-party package adds one with its own entry point.
[project.entry-points."mowdeck.notification_channels"]
log = "notifications.adapters.channels.log:create_log_channel"
webpush = "notifications.adapters.channels.webpush:create_webpush_channel"
ntfy = "notifications.adapters.channels.ntfy:create_ntfy_channel"
apns = "notifications.adapters.channels.apns:create_apns_channel"

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-authz = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications"]
