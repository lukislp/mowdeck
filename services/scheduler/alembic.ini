# Alembic configuration for development (creating revisions). The container runs
# `python -m scheduler.adapters.db.migrate`, which builds the same configuration in code.
# The database URL comes from MOWDECK_DATABASE_URL (see migrations/env.py), never from this file.
#
#   uv run alembic -c services/scheduler/alembic.ini revision -m "add table"

[alembic]
script_location = %(here)s/src/scheduler/adapters/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
