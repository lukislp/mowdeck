# Compose block for scheduler: paste the entries below "services:" into
# infra/compose/docker-compose.yml. Build context is the repository root.
# (Already pasted; keep both in sync.)
services:
  # One-shot job: Alembic migrations of the scheduler database (idempotent).
  scheduler-migrate:
    image: mowdeck/scheduler:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24}
    command: ["python", "-m", "scheduler.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://scheduler:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/scheduler
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Mowing schedules (weekly or every N days) with a rain pause. Every replica ticks
  # (row locks, SKIP LOCKED); starts and returns to the dock go through Fleet
  # (fleet.commands.issue) on behalf of the schedule's owner. The rain pause asks
  # Open-Meteo (internet access to api.open-meteo.com); set
  # SCHEDULER_WEATHER_PROVIDER=static for offline installations.
  scheduler:
    image: mowdeck/scheduler:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_DATABASE_URL: postgresql://scheduler:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/scheduler
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
      MOWDECK_SCHEDULER_WEATHER_PROVIDER: ${SCHEDULER_WEATHER_PROVIDER:-open_meteo}
      MOWDECK_SCHEDULER_STATIC_WEATHER: ${SCHEDULER_STATIC_WEATHER:-dry}
      MOWDECK_SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-30}
      MOWDECK_SCHEDULER_DEV_ENDPOINTS: ${SCHEDULER_DEV_ENDPOINTS:-false}
    labels:
      - traefik.enable=true
      - traefik.http.routers.scheduler.rule=PathPrefix(`/api/v1/scheduler`)
      - traefik.http.routers.scheduler.entrypoints=web
      - traefik.http.services.scheduler.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      openfga:
        condition: service_healthy
      scheduler-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]
