[project]
name = "fleet"
version = "0.1.0"
description = "Sites, groups and mowers of an account, their place in the hierarchy, and the commands sent to them."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-auth",
  "mowdeck-authz[fastapi]",
  "mowdeck-contracts",
  "mowdeck-service-kit[db]",
  "alembic>=1.16.0",
  # IANA time zones for zoneinfo on systems without a zone database (Windows, slim images).
  "tzdata>=2025.2",
]

[project.scripts]
fleet = "fleet.main:main"
fleet-migrate = "fleet.adapters.db.migrate:main"

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-authz = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]
