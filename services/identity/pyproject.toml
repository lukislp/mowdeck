[project]
name = "identity"
version = "0.1.0"
description = "Accounts, users, roles, sessions and tokens: who is who and who may do what."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-auth",
  "mowdeck-authz[fastapi]",
  "mowdeck-contracts",
  "mowdeck-service-kit[db]",
  "alembic>=1.16.0",
  "argon2-cffi>=25.1.0",
  "cryptography>=44.0.0",
  "httpx>=0.28.1",
  "webauthn>=3.0.1",
]

[project.scripts]
identity = "identity.main:main"
identity-migrate = "identity.adapters.db.migrate:main"
identity-cli = "identity.cli:main"

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-authz = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]
