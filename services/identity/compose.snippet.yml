# Compose block for identity, as used in infra/compose/docker-compose.yml.
# Generated from templates/service and extended with the identity settings.
services:
  # One-shot job: Alembic migrations of the identity database (idempotent).
  identity-migrate:
    image: mowdeck/identity:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "identity.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://identity:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/identity
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # Accounts, users, roles, sessions, API tokens; issues the access tokens
  # (EdDSA JWT) and publishes the public keys at /.well-known/jwks.json.
  # Services verify tokens locally with mowdeck-auth against
  # http://identity:8000/.well-known/jwks.json (inside the compose network).
  identity:
    image: mowdeck/identity:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_NATS_USER: identity
      MOWDECK_NATS_PASSWORD: ${NATS_PASSWORD_IDENTITY:?set NATS_PASSWORD_IDENTITY in infra/compose/.env (./nats-passwords.sh .env, docs/ops/compose.md)}
      MOWDECK_DATABASE_URL: postgresql://identity:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/identity
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      MOWDECK_IDENTITY_KEY_ENCRYPTION_KEY: ${IDENTITY_KEY_ENCRYPTION_KEY:?set IDENTITY_KEY_ENCRYPTION_KEY in infra/compose/.env}
      MOWDECK_IDENTITY_REGISTRATION: ${IDENTITY_REGISTRATION:-open}
      MOWDECK_IDENTITY_ARGON2_PROFILE: ${IDENTITY_ARGON2_PROFILE:-rfc9106_low}
      MOWDECK_IDENTITY_MODULE_URLS: http://device-gateway:8000
      # Only Traefik reaches the service, so its X-Forwarded-For is trusted.
      MOWDECK_IDENTITY_TRUST_FORWARDED_FOR: "true"
      # Plain HTTP in development; set to true behind HTTPS.
      MOWDECK_IDENTITY_REFRESH_COOKIE_SECURE: ${IDENTITY_REFRESH_COOKIE_SECURE:-false}
    labels:
      - traefik.enable=true
      - traefik.http.routers.identity.rule=PathPrefix(`/api/v1/identity`)
      - traefik.http.routers.identity.entrypoints=web
      - traefik.http.routers.identity.service=identity
      # Login, refresh, registration and token exchange: rate limited per client IP.
      - traefik.http.routers.identity-auth.rule=PathPrefix(`/api/v1/identity/session`) || Path(`/api/v1/identity/register`) || Path(`/api/v1/identity/token`)
      - traefik.http.routers.identity-auth.entrypoints=web
      - traefik.http.routers.identity-auth.priority=100
      - traefik.http.routers.identity-auth.middlewares=identity-ratelimit
      - traefik.http.routers.identity-auth.service=identity
      - traefik.http.middlewares.identity-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.identity-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.identity-ratelimit.ratelimit.burst=20
      - traefik.http.routers.identity-jwks.rule=Path(`/.well-known/jwks.json`)
      - traefik.http.routers.identity-jwks.entrypoints=web
      - traefik.http.routers.identity-jwks.service=identity
      - traefik.http.services.identity.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/startupz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      nats-streams:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      identity-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]
