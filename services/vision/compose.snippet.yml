# Compose block of vision as pasted into infra/compose/docker-compose.yml (build context: the
# repository root).
services:
  # One-shot job: Alembic migrations of the vision database (idempotent).
  vision-migrate:
    image: mowdeck/vision:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/vision/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    command: ["python", "-m", "vision.adapters.db.migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_DATABASE_URL: postgresql://vision:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/vision
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mowdeck]

  # AI assist (ADR 0033): camera snapshot and map context to a vision model (any family through
  # LiteLLM), a proposed maneuver a user approves, driven through fleet.drive.* with blades off.
  # Users configure their own provider in the web app; VISION_DEFAULT_* offers the
  # installation's model (off by default). VISION_DEFAULT_MODEL=fake/recover is the offline demo.
  vision:
    image: mowdeck/vision:${MOWDECK_VERSION:-dev}
    build:
      context: ../..
      dockerfile: services/vision/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      MOWDECK_NATS_URL: nats://nats:4222
      MOWDECK_DATABASE_URL: postgresql://vision:${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD}@postgres:5432/vision
      MOWDECK_OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      MOWDECK_OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-${OPENFGA_AUTHN_PRESHARED_KEYS:?set OPENFGA_AUTHN_PRESHARED_KEYS}}
      MOWDECK_OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-mowdeck}
      # Access tokens are verified locally against Identity's public keys.
      MOWDECK_AUTH_JWKS_URL: http://identity:8000/.well-known/jwks.json
      MOWDECK_ENTITLEMENTS_BILLING_ENABLED: ${ENTITLEMENTS_BILLING_ENABLED:-false}
      MOWDECK_VISION_DEFAULT_ENABLED: ${VISION_DEFAULT_ENABLED:-false}
      MOWDECK_VISION_DEFAULT_MODEL: ${VISION_DEFAULT_MODEL:-anthropic/claude-sonnet-5-5}
      MOWDECK_VISION_DEFAULT_API_BASE: ${VISION_DEFAULT_API_BASE:-}
      MOWDECK_VISION_DEFAULT_API_KEY: ${VISION_DEFAULT_API_KEY:-}
      MOWDECK_VISION_SECRETS_KEY: ${VISION_SECRETS_KEY:-}
      MOWDECK_VISION_ALLOW_FAKE_PROVIDER: ${VISION_ALLOW_FAKE_PROVIDER:-false}
      MOWDECK_VISION_USER_API_BASE_POLICY: ${VISION_USER_API_BASE_POLICY:-any}
      MOWDECK_VISION_PROPOSAL_TTL_SECONDS: ${VISION_PROPOSAL_TTL_SECONDS:-300}
      MOWDECK_VISION_MAX_ROUNDS: ${VISION_MAX_ROUNDS:-3}
      MOWDECK_VISION_USER_DAILY_REQUESTS: ${VISION_USER_DAILY_REQUESTS:-20}
      MOWDECK_VISION_HOSTED_ACCOUNT_DAILY_REQUESTS: ${VISION_HOSTED_ACCOUNT_DAILY_REQUESTS:-50}
      MOWDECK_VISION_KEEP_IMAGES_DAYS: ${VISION_KEEP_IMAGES_DAYS:-0}
      # Automatic AI analysis on errors (ADR 0035, opt-in per user in the web app).
      MOWDECK_VISION_AUTO_ENABLED: ${VISION_AUTO_ENABLED:-true}
      MOWDECK_VISION_AUTO_COOLDOWN_MINUTES: ${VISION_AUTO_COOLDOWN_MINUTES:-10}
      MOWDECK_VISION_AUTO_DAILY_PER_MOWER: ${VISION_AUTO_DAILY_PER_MOWER:-20}
      MOWDECK_VISION_PHOTO_TIMEOUT_SECONDS: ${VISION_PHOTO_TIMEOUT_SECONDS:-35}
    labels:
      - traefik.enable=true
      - traefik.http.routers.vision.rule=PathPrefix(`/api/v1/vision`)
      - traefik.http.routers.vision.entrypoints=web
      - traefik.http.services.vision.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    stop_grace_period: 20s
    depends_on:
      nats:
        condition: service_healthy
      openfga:
        condition: service_healthy
      vision-migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
    networks: [mowdeck]

  # Still frames of live cameras without an open browser (ADR 0035), `--profile capture`; the
  # gateway needs GATEWAY_CAPTURE_URL=http://vision-capture:8000. Internal only, no route.
  vision-capture:
    image: mowdeck/vision-capture:${MOWDECK_VERSION:-dev}
    profiles: [capture]
    build:
      context: ../..
      dockerfile: services/vision/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a}
        WITH_CAPTURE: "true"
    command: ["python", "-m", "vision.capture"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      MOWDECK_ENVIRONMENT: ${MOWDECK_ENVIRONMENT:-dev}
      MOWDECK_LOG_LEVEL: ${MOWDECK_LOG_LEVEL:-INFO}
      MOWDECK_LOG_FORMAT: json
      HOME: /tmp
      MOWDECK_CAPTURE_TOKEN: ${CAPTURE_TOKEN:-}
      MOWDECK_CAPTURE_MAX_CONCURRENCY: ${CAPTURE_MAX_CONCURRENCY:-2}
      MOWDECK_CAPTURE_BROWSER_CHANNEL: ${CAPTURE_BROWSER_CHANNEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s
    networks: [mowdeck]
