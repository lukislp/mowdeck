[project]
name = "vision"
version = "0.1.0"
description = "AI assist for stuck mowers: camera image and map context to a vision model, a proposed maneuver that a user approves, executed through the drive channel."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-auth",
  "mowdeck-authz[fastapi]",
  "mowdeck-contracts",
  # Geometry (local frame, polygons), the tiny test image and Pillow (extra photo) for the
  # brightness of camera frames (dark frame: switch the mower's light on).
  "mowdeck-control[photo]",
  "mowdeck-service-kit[db]",
  "alembic>=1.16.0",
  # AES-GCM for the users' provider keys at rest.
  "cryptography>=44.0.0",
  # One client for every vision model family (Anthropic, OpenAI, Gemini, Mistral, Ollama,
  # OpenAI-compatible endpoints). Imported lazily: the fake provider and the tests need it not.
  # Costs come from the model price map bundled with the release (no download at startup), so
  # the floor is the first release whose map prices the documented models (claude-*-5-5, gpt-6).
  "litellm>=1.106.0,<2",
  # multipart/form-data uploads of camera snapshots.
  "python-multipart>=0.0.20",
]

[project.scripts]
vision = "vision.main:main"
vision-migrate = "vision.adapters.db.migrate:main"

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-authz = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-control = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]
