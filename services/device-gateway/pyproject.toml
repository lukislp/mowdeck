[project]
name = "device-gateway"
version = "0.1.0"
description = "Holds the connections to mowers, executes commands and reports their state."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-auth",
  "mowdeck-contracts",
  "mowdeck-control",
  # GPL-3.0 adapter for Mammotion mowers (cloud and BLE bridge), see ADR 0011 and ADR 0019.
  "mowdeck-control-mammotion[esphome]",
  # Apache-2.0 adapter for Husqvarna Automower (Automower Connect API), off by default until
  # tested on real hardware (ADR 0066).
  "mowdeck-control-husqvarna",
  # GPL-3.0 adapter for Worx Landroid, Kress and LandXcape (unofficial cloud API), off by default
  # until tested on real hardware (ADR 0066).
  "mowdeck-control-worx",
  "mowdeck-service-kit",
  # Client of the camera relay's frame tap (still frames of a live camera, ADR 0045).
  "httpx>=0.28.1",
]

[project.scripts]
device-gateway = "device_gateway.main:main"

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-control = { workspace = true }
mowdeck-control-husqvarna = { workspace = true }
mowdeck-control-mammotion = { workspace = true }
mowdeck-control-worx = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_gateway"]
