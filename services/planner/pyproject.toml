[project]
name = "planner"
version = "0.1.0"
description = "Mowing patterns as plug-ins: computes, checks and previews spot mowing routes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "MowDeck contributors" }]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mowdeck-auth",
  "mowdeck-authz[fastapi]",
  "mowdeck-contracts",
  # Apache-2.0, no network code: the WGS84 conversion of maps (mowdeck_control.geo).
  "mowdeck-control",
  "mowdeck-patterns",
  "mowdeck-service-kit[db]",
  "alembic>=1.16.0",
]

[project.scripts]
planner = "planner.main:main"
planner-migrate = "planner.adapters.db.migrate:main"

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-authz = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-control = { workspace = true }
mowdeck-patterns = { workspace = true }
mowdeck-service-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]
