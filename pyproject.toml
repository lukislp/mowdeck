[project]
name = "mowdeck-workspace"
version = "0.0.0"
description = "MowDeck monorepo workspace root (not published)."
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "AGPL-3.0-only" }

[tool.uv]
package = false
# litellm caps filelock below 4.0, but the fixes for GHSA-567q-5qvw-pf92, GHSA-9vhv-jxww-xfm5 and
# GHSA-v4x8-3wr5-3wq8 exist only in filelock 4.2.1+. litellm only takes a FileLock in its proxy
# CLI and huggingface-hub uses FileLock/SoftFileLock, whose API 4.x keeps (4.0 breaks only
# SoftReadWriteLock). Drop this once litellm allows filelock 4.
override-dependencies = ["filelock>=4.2.1"]

[tool.uv.workspace]
members = ["libs/*/", "services/*/", "tools/*/", "integrations/agora-bridge/"]
# pnpm packages of the web frontend (pnpm-workspace.yaml), not Python packages.
exclude = ["libs/mowdeck-ui", "tools/ts-codegen", "services/matter-server"]

[dependency-groups]
dev = [
  "ruff>=0.8.4",
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "pytest-timeout>=2.4.0",
  "poethepoet>=0.31.1",
  "pyyaml>=6.0.2",
  "types-pyyaml>=6.0.12",
  "types-shapely>=2.1.0.20250512",
  "mkdocs-material>=9.5.49",
  "copier>=9.18.2",
  # Phase 1 acceptance test (tests/e2e): HTTP and WebSocket clients.
  "httpx>=0.28.1",
  "websockets>=17.2",
  # camera-relay media integration tests (services/camera-relay/tests/media): the WHEP client.
  "aiortc>=1.15.0",
  # Workspace libraries, installed editable so their tests and type checks run from the root.
  "mowdeck-auth",
  "mowdeck-authz[fastapi]",
  "mowdeck-contracts",
  "mowdeck-control",
  "mowdeck-control-mammotion[esphome]",
  "mowdeck-control-worx",
  "mowdeck-patterns",
  "mowdeck-service-kit[db,otel,testing]",
  "mowdeck-wiki-sync",
  # The Agora camera source bridge (Apache-2.0, standard library only; the SDK is never
  # installed here, its tests use a fake SDK).
  "agora-bridge",
  # Services, installed editable for their tests and type checks.
  "billing",
  "camera-relay",
  "device-gateway",
  "entitlements",
  "fleet",
  "identity",
  "notifications",
  "planner",
  "realtime",
  "scheduler",
  "telemetry",
  "vision",
]

[tool.uv.sources]
mowdeck-auth = { workspace = true }
mowdeck-authz = { workspace = true }
mowdeck-contracts = { workspace = true }
mowdeck-control = { workspace = true }
mowdeck-control-mammotion = { workspace = true }
mowdeck-control-worx = { workspace = true }
mowdeck-patterns = { workspace = true }
mowdeck-service-kit = { workspace = true }
mowdeck-wiki-sync = { workspace = true }
agora-bridge = { workspace = true }
billing = { workspace = true }
camera-relay = { workspace = true }
device-gateway = { workspace = true }
entitlements = { workspace = true }
fleet = { workspace = true }
identity = { workspace = true }
notifications = { workspace = true }
planner = { workspace = true }
realtime = { workspace = true }
scheduler = { workspace = true }
telemetry = { workspace = true }
vision = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
# templates/service/template holds Jinja sources; the generated services are linted instead.
extend-exclude = ["site", "templates/service/template"]
# Service packages are first-party everywhere (their tests and scripts import them).
src = [".", "services/*/src", "integrations/agora-bridge/src", "fuzz"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
# Fuzz targets state their properties as assertions (a failed one is a finding).
"fuzz/**" = ["S101"]
# Alembic revision files are named after their revision id.
"**/migrations/versions/*.py" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.13"
files = [
  "tools",
  "libs/mowdeck-auth",
  "libs/mowdeck-authz",
  "libs/mowdeck-contracts",
  "libs/mowdeck-control",
  "libs/mowdeck-control-mammotion",
  "libs/mowdeck-control-worx",
  "libs/mowdeck-patterns",
  "libs/mowdeck-service-kit",
  "services",
  "integrations/agora-bridge/src",
  "integrations/agora-bridge/tests",
  "tests/e2e",
  "fuzz",
]
# Alembic environments and revisions are scripts, not importable modules.
exclude = ["/migrations/"]

# PyMammotion (GPL, used only by libs/mowdeck-control-mammotion) ships py.typed but parts of it
# are unannotated; missing stubs never fail the build. Our own code stays strict.
[[tool.mypy.overrides]]
module = ["pymammotion.*"]
ignore_missing_imports = true

# pyworxcloud (GPL, used only by libs/mowdeck-control-worx) ships no type information; the
# adapter keeps it behind its own typed session port.
[[tool.mypy.overrides]]
module = ["pyworxcloud", "pyworxcloud.*"]
ignore_missing_imports = true

# Atheris (the fuzzing engine of fuzz/) is installed only in the ClusterFuzzLite build image.
[[tool.mypy.overrides]]
module = ["atheris"]
ignore_missing_imports = true

# The Agora SDK wrapper (agora-python-server-sdk) is installed only in the operator-built
# agora-bridge image; its adapter subclasses the wrapper's untyped observer classes.
[[tool.mypy.overrides]]
module = ["agora.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["agora_bridge.agora_sdk"]
disallow_subclassing_any = false

# pywebpush and py-vapid (Web Push in services/notifications) ship no type information.
[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*", "http_ece.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tools", "libs", "services", "integrations/agora-bridge/tests"]
# The Phase 1 acceptance test (tests/e2e, marker e2e) needs the Compose stack: `poe e2e`.
addopts = "-ra -m 'not e2e'"
# A test that hangs ends the run after this many seconds with the stack of every thread
# (pytest-timeout, thread method: works even when the event loop itself is blocked) instead of
# blocking the CI job. The acceptance and media tests set longer limits on their command line.
timeout = 120
timeout_method = "thread"
markers = [
  "e2e: acceptance tests against a running Compose stack (uv run poe e2e)",
  "slow: long-running e2e checks such as the idle WebSocket through Traefik",
]

[tool.coverage.run]
branch = true

[tool.poe.tasks]
lint-ruff = "ruff check ."
lint-format = "ruff format --check ."
lint-mypy = "mypy"
fmt = ["_fmt-fix", "_fmt-format"]
_fmt-fix = "ruff check --fix ."
_fmt-format = "ruff format ."
test = "pytest --cov --cov-report=term-missing"
# Phase 1 acceptance test against the throwaway test stack (`pnpm e2e:stack up`, then
# `pnpm e2e:stack acceptance`); it refuses a stack without the e2e marker.
e2e = "pytest tests/e2e -m e2e -p no:cacheprovider --timeout 600"
docs = "mkdocs build --strict"
wiki = "wiki-sync build --docs docs --mkdocs mkdocs.yml --out build/wiki"
# OpenAPI documents of the services for the web app's generated types (apps/web/openapi).
openapi = "python tools/repo-checks/scripts/export_openapi.py"
openapi-check = "python tools/repo-checks/scripts/export_openapi.py --check"
# HTTP API reference (Markdown) rendered from those OpenAPI documents: docs/reference/api.
api-reference = "python tools/repo-checks/scripts/api_reference.py"
api-reference-check = "python tools/repo-checks/scripts/api_reference.py --check"
# Architecture diagrams (Mermaid) generated from the Compose file, the NATS subjects and the
# OpenAPI documents: docs/architecture/generated.md.
arch-diagrams = "python tools/repo-checks/scripts/arch_diagrams.py"
arch-diagrams-check = "python tools/repo-checks/scripts/arch_diagrams.py --check"
compose-check ="docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.example config -q"
# OpenFGA model tests with the pinned CLI image (same as the openfga-model CI job).
fga-test = "docker run --rm -v ${POE_ROOT}/infra/openfga:/w -w /w openfga/cli:v0.8.1 model test --tests model.fga.yaml"
# Regenerate the JSON form of the model packaged in mowdeck-authz (after editing model.fga).
fga-json = "python infra/openfga/sync_model_json.py --write"

[tool.poe.tasks.lint]
sequence = ["lint-ruff", "lint-format", "lint-mypy"]
help = "Ruff check, ruff format check and mypy (strict)"
