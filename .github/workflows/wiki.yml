name: wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/wiki-sync/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    # Pushes the rendered pages to the wiki repository with GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync
      - run: uv run wiki-sync build --docs docs --mkdocs mkdocs.yml --out build/wiki --commit ${{ github.sha }}
      - name: Publish to the wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" wiki; then
            echo "::error::Wiki repository not initialised. Create the first page once at https://github.com/${REPO}/wiki, then re-run this workflow."
            exit 1
          fi
          git -C wiki ls-files -z | xargs -0 -r git -C wiki rm -q -f --
          cp build/wiki/*.md wiki/
          git -C wiki add -A
          if git -C wiki diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git -C wiki -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: sync wiki from ${SHA}"
          git -C wiki push
