name: mirror-images

# Copies every third-party image of infra/images.txt (all architectures) to
#   ghcr.io/<owner>/mowdeck-mirror/<alias>:<tag>
# CI pulls these with GITHUB_TOKEN, so it no longer depends on the anonymous, shared rate limits
# of Docker Hub and ECR Public. Runs rarely: when the list or this workflow changes on main or in
# a pull request (so a pull request that adds or bumps an image fills the mirror itself; if its
# CI was faster, re-run the failed jobs), or by hand (gh workflow run mirror-images.yml).
# Copies whose digest already matches are skipped, so a re-run is cheap.
# The packages are private like the repository; see infra/compose/README.md to make them public.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/images.txt
      - .github/workflows/mirror-images.yml
  pull_request:
    paths:
      - infra/images.txt
      - .github/workflows/mirror-images.yml

concurrency:
  group: mirror-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRANE_VERSION: v0.22.1
      # sha256 of go-containerregistry_Linux_x86_64.tar.gz from the release's checksums.txt
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane
        run: |
          curl -fsSL -o crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf crane.tar.gz -C "$RUNNER_TEMP/bin" crane
          rm crane.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Copy the images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          mirror="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/mowdeck-mirror"
          # Retries with backoff (rate limits: toomanyrequests, Rate exceeded, 429, 5xx). Only
          # stdout is returned; crane's own retry messages stay in the log (stderr).
          retry() {
            delay=20
            for attempt in 1 2 3 4 5 6; do
              if out=$("$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              [ "$attempt" = 6 ] && return 1
              echo "attempt $attempt failed, retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          failed=0
          while read -r alias source _; do
            case "$alias" in ''|'#'*) continue ;; esac
            tag="${source##*:}"
            target="$mirror/$alias:$tag"
            want=$(retry crane digest "$source") || { echo "::error::cannot resolve $source"; failed=1; continue; }
            have=$(crane digest "$target" 2>/dev/null || true)
            if [ "$want" = "$have" ]; then
              echo "up to date: $target ($want)"
              echo "- \`$target\` up to date ($want)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "copying $source -> $target ($want)"
            if retry crane copy "$source" "$target"; then
              echo "- \`$target\` copied from \`$source\` ($want)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::copy of $source failed"
              failed=1
            fi
          done < infra/images.txt
          exit "$failed"
