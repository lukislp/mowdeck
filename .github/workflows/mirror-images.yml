name: mirror-images

# Copies every third-party image pinned under "Image sources" in infra/compose/.env.example (all
# architectures, digests unchanged) to the repository's own package namespace
#   ghcr.io/<owner>/mowdeck/mirror/<alias>:<tag>
# (a line pinned as image:tag@sha256:<digest> is copied at that digest under its tag)
# (alias: the variable name without _IMAGE, lower case, "-" for "_": postgres, fga-cli,
# stripe-mock; infra/mirror-env.sh --list prints the pairs). CI pulls these with GITHUB_TOKEN:
# anonymous pulls from the public registries run into their rate limits (429 Too Many Requests),
# which every GitHub-hosted runner behind the same egress address shares. Runs rarely: when the
# list, infra/mirror-env.sh or this workflow changes on main or in a pull request of this
# repository (so a pull request that adds or bumps an image fills the mirror itself; if its CI
# jobs pulled before the copy finished, re-run them), and by hand:
#   gh workflow run mirror-images.yml
# Images whose mirrored digest already equals the source are skipped, so a re-run is cheap. The
# packages (visibility, connecting them to the repository): infra/compose/README.md, "Image sources".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/compose/.env.example
      - infra/mirror-env.sh
      - .github/workflows/mirror-images.yml
  pull_request:
    paths:
      - infra/compose/.env.example
      - infra/mirror-env.sh
      - .github/workflows/mirror-images.yml

concurrency:
  group: mirror-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # A pull request from a fork runs with a read-only GITHUB_TOKEN and cannot fill the mirror.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Writes the mirror packages under ghcr.io/<owner>/mowdeck/mirror.
    permissions:
      contents: read
      packages: write
    env:
      CRANE_VERSION: v0.22.1
      # sha256 of go-containerregistry_Linux_x86_64.tar.gz from the release's checksums.txt
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane
        run: |
          curl -fsSL -o crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf crane.tar.gz -C "$RUNNER_TEMP/bin" crane
          rm crane.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # crane copy keeps every manifest and digest as published upstream, which is what makes the
      # mirror verifiable (crane digest of source and copy agree); it therefore adds no label or
      # annotation of its own. The link of each package to this repository is set once in GHCR
      # (infra/compose/README.md, "Image sources").
      - name: Copy the images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          mirror="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/mowdeck/mirror"
          sh infra/mirror-env.sh --list > "$RUNNER_TEMP/images.txt"
          # Retries with backoff (rate limits: toomanyrequests, Rate exceeded, 429, 5xx). Only
          # stdout is returned; crane's own retry messages stay in the log (stderr).
          retry() {
            delay=20
            for attempt in 1 2 3 4 5 6; do
              if out=$("$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              [ "$attempt" = 6 ] && return 1
              echo "attempt $attempt failed, retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          failed=0
          while read -r alias source; do
            # A source pinned as image:tag@sha256:... is copied at exactly that digest.
            ref="${source%@*}"
            tag="${ref##*:}"
            target="$mirror/$alias:$tag"
            want=$(retry crane digest "$source") || { echo "::error::cannot resolve $source"; failed=1; continue; }
            have=$(crane digest "$target" 2>/dev/null || true)
            if [ "$want" = "$have" ]; then
              echo "up to date: $target ($want)"
              echo "- \`$target\` up to date ($want)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "copying $source -> $target ($want)"
            if retry crane copy "$source" "$target"; then
              echo "- \`$target\` copied from \`$source\` ($want)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::copy of $source failed"
              failed=1
            fi
          done < "$RUNNER_TEMP/images.txt"
          exit "$failed"
