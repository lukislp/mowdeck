name: helm-kind

# Install test of the Helm chart in a kind cluster (infra/helm/kind-test.sh): CloudNativePG
# operator, Traefik, the chart with values-homelab.yaml and the in-cluster PostgreSQL, an upgrade,
# then the Phase 1 acceptance test (uv run poe e2e) through Traefik. About 15 minutes, so it runs
# only by hand (gh workflow run helm-kind.yml) and for release tags, never on pull requests; the
# cheap chart checks are the "helm" job of ci.yml.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: helm-kind-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read access to the GHCR image mirror (see ci.yml); nothing is pushed here.
  packages: read

env:
  MOWDECK_IMAGE_MIRROR: ghcr.io/${{ github.repository_owner }}/mowdeck/mirror

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NATS_IMAGE, OPENFGA_IMAGE, TRAEFIK_IMAGE and the base images from the GHCR mirror of the
      # Compose example file's "Image sources" (the login is for pulling only); the test script
      # pulls the three infrastructure images on the runner and loads them into the kind node
      # together with the images built below.
      - name: Log in to the GHCR image mirror
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the image mirror
        run: sh infra/mirror-env.sh | tee -a "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # amd64 images with the GitHub Actions cache of the CI docker job (same scopes), built into
      # the runner's Docker daemon only (push: false, load: true): no registry is involved, the
      # test script loads them into the kind node with `kind load docker-image` and the chart runs
      # them with pullPolicy Never (ci/kind-values.yaml). The ghcr.io/lukislp/mowdeck/<image> names
      # are the chart's defaults; nothing is pushed under them here.
      - name: Build identity
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/identity/Dockerfile
          build-args: &python-build-args |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            UV_IMAGE=${{ env.UV_IMAGE }}
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/identity:kind
          cache-from: type=gha,scope=identity
      - name: Build fleet
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/fleet/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/fleet:kind
          cache-from: type=gha,scope=fleet
      - name: Build device-gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/device-gateway/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/device-gateway:kind
          cache-from: type=gha,scope=device-gateway
      - name: Build telemetry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/telemetry/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/telemetry:kind
          cache-from: type=gha,scope=telemetry
      - name: Build realtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/realtime/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/realtime:kind
          cache-from: type=gha,scope=realtime
      - name: Build notifications
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/notifications/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/notifications:kind
          cache-from: type=gha,scope=notifications
      - name: Build scheduler
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/scheduler/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/scheduler:kind
          cache-from: type=gha,scope=scheduler
      - name: Build entitlements
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/entitlements/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/entitlements:kind
          cache-from: type=gha,scope=entitlements
      - name: Build planner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/planner/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/planner:kind
          cache-from: type=gha,scope=planner
      - name: Build vision
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/vision/Dockerfile
          build-args: *python-build-args
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/vision:kind
          cache-from: type=gha,scope=vision
      - name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NGINX_IMAGE=${{ env.NGINX_IMAGE }}
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/web:kind
          cache-from: type=gha,scope=web
      - name: Build authz-bootstrap
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/openfga
          file: infra/openfga/bootstrap/Dockerfile
          build-args: |
            FGA_CLI_IMAGE=${{ env.FGA_CLI_IMAGE }}
            JQ_IMAGE=${{ env.JQ_IMAGE }}
            BUSYBOX_IMAGE=${{ env.BUSYBOX_IMAGE }}
          push: false
          load: true
          tags: ghcr.io/lukislp/mowdeck/authz-bootstrap:kind
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: Install the chart in kind and run the acceptance test
        env:
          E2E: "1"
          KEEP: "1"
        run: sh infra/helm/kind-test.sh
