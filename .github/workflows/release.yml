name: release

# Publishes a MowDeck release (docs/ops/release.md). Every push to main asks semantic-release
# (.releaserc.json, Conventional Commits) whether the commits since the last tag warrant a release:
# fix/refactor/perf -> patch, feat -> minor, and while the version line is 0.x a breaking change is
# a minor too. When they do, the run
#   * creates the SSH-signed tag v<version> and the GitHub release with the notes semantic-release
#     writes from the commits (job tag),
#   * checks every image built from that tag with the licence gate before anything is pushed
#     (job licence-gate: no Agora SDK, only open source licences, the licence label of each
#     Dockerfile; LICENSING.md),
#   * builds every image from that tag for linux/amd64 and linux/arm64 (QEMU, no build cache)
#     to ghcr.io/<owner>/mowdeck/<image>:<version>, :v<version> and :latest, with an SBOM and a
#     provenance attestation in the image index, a Sigstore keyless signature and a GitHub build
#     provenance attestation in the registry, and an SPDX SBOM file,
#   * pushes the Helm chart as an OCI artifact ghcr.io/<owner>/charts/mowdeck:<version> (appVersion
#     = version, so image.tag defaults to the released images), signed and attested the same way,
#   * builds the Android app as mowdeck-<version>.apk (apps/mobile, docs/ops/mobile-apps.md),
#     signed with the repository's release keystore; skipped with a warning while it is not set,
#   * attaches the chart, the SBOMs and the APK to the release with SHA256SUMS, a Sigstore bundle
#     (*.sigstore.json) per file and the build provenance (mowdeck-<version>.intoto.jsonl), and
#     lists the image digests and the verification commands in the release notes (job publish).
# Nothing is published from a push whose commits are docs/ci/chore/test only. By hand the workflow
# builds a test version (for example 0.1.0-rc.1) from any branch: images and chart, no tag, no
# GitHub release, no :latest. Versions are set at build time (image labels, chart version and
# appVersion, APK); no file in the repository carries the release version, so a release makes no
# commit. Never on pull requests (minute budget).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Test build version without the v (e.g. 0.1.0-rc.1); no tag, no GitHub release"
        required: true

# One release chain at a time; a newer push waits instead of cancelling a release in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Base images from the repository's GHCR mirror (see ci.yml); the mirror holds every
  # architecture of each image.
  MOWDECK_IMAGE_MIRROR: ghcr.io/${{ github.repository_owner }}/mowdeck/mirror

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # @semantic-release/github's verifyConditions checks that the token may push (contents:
    # write), even in a dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      build: ${{ steps.version.outputs.build }}
      latest: ${{ steps.version.outputs.latest }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # ref: main (the branch tip), not the event SHA: semantic-release refuses to release from a
      # checkout that is behind the remote, and the real release in job tag is cut from the tip.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      # semantic-release runs from lukislp/ci-workflows' pinned toolchain (lock file in the
      # action) instead of a registry install per run or a package.json here. The deploy key (if
      # set) makes the tag push in job tag a push by a key rather than by GITHUB_TOKEN, so it
      # starts the tag workflows (helm-kind.yml); verifyConditions runs a push --dry-run here too.
      - if: github.event_name == 'push'
        name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      # Dry run: computes the next version from the commits since the last tag without tagging.
      # "No relevant changes" is the expected outcome for docs/ci/chore-only pushes, not a failure.
      - if: github.event_name == 'push'
        id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          PUBLISHED: ${{ steps.semrel.outputs.new_release_published }}
          NEXT_VERSION: ${{ steps.semrel.outputs.new_release_version }}
          INPUT_VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          release=false
          build=false
          version=""
          if [ "$EVENT" = push ]; then
            if [ "$PUBLISHED" != true ]; then
              echo "No releasable commits since the last tag (docs, ci, chore, test only): nothing to publish. This is the common case, not a failure." | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$(git rev-parse HEAD)" != "$SHA" ]; then
              echo "main moved past this run's commit ($SHA): the newer push's run releases it." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              version="$NEXT_VERSION"
              # semantic-release starts a repository without tags at 1.0.0. MowDeck's line starts
              # at 0.x from the initial tag v0.0.0 (docs/ops/release.md), so a missing tag is a
              # setup error, never a reason to publish 1.0.0.
              if [ -z "$(git tag --list 'v*')" ]; then
                echo "::error::no v* tag exists, so semantic-release would publish $version. Create the initial tag v0.0.0 first (docs/ops/release.md, 'Setting up releases')."
                exit 1
              fi
              # Signed releases: the tag is signed with DEPLOY_SIGNING_KEY, whose public half must
              # be a signing key of the owner's account, or GitHub shows the tag as unverified.
              if [ -z "$SIGNING_KEY" ]; then
                echo "::error::DEPLOY_SIGNING_KEY is not set: the release tag cannot be signed (docs/ops/release.md, 'Setting up releases')."
                exit 1
              fi
              key="$RUNNER_TEMP/signing_key"
              printf '%s\n' "$SIGNING_KEY" > "$key"
              chmod 600 "$key"
              public="$(ssh-keygen -y -f "$key" | awk '{print $2}')"
              rm -f "$key"
              if ! gh api --paginate "users/$OWNER/ssh_signing_keys?per_page=100" --jq '.[].key' | grep -qF "$public"; then
                echo "::error::the public half of DEPLOY_SIGNING_KEY is not a signing key of $OWNER (github.com/settings/keys), so the tag would show as unverified."
                exit 1
              fi
              release=true
              build=true
            fi
          else
            version="$INPUT_VERSION"
            build=true
          fi
          if [ "$build" = true ] && ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version (1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "build=$build"
            echo "latest=$release"
            echo "owner=$owner"
          } | tee -a "$GITHUB_OUTPUT"

  # The real semantic-release run: the signed tag v<version> and the GitHub release with the
  # generated notes. It runs before anything is built, so nothing is published under a version
  # that has no tag; the jobs below build from the tag.
  tag:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # @semantic-release/github comments on the released pull requests and issues.
      issues: write
      pull-requests: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      # semantic-release tags the checked-out tip of main; the build jobs check out this run's
      # commit (github.sha). Both must be the same commit, or nothing is tagged (a newer push's
      # run, queued behind this one, then releases).
      - name: The tip of main is this run's commit
        env:
          SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "::error::main moved to $head since this run started at $SHA; not tagging. The run of the newer push releases."
            exit 1
          fi
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      # semantic-release creates its tag with a plain `git tag <name> <sha>`. With tag.gpgSign git
      # makes that an annotated tag signed with the SSH key; the "editor" writes the tag message,
      # and the tagger is the owner's noreply address, which GitHub needs to show "Verified".
      - name: Sign the release tag with the SSH signing key
        env:
          SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: |
          set -eu
          key="$RUNNER_TEMP/release_signing_key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          chmod 600 "$key"
          # git's SSH signing loads the public key from user.signingkey.
          ssh-keygen -y -f "$key" > "$key.pub"
          git config gpg.format ssh
          git config user.signingkey "$key.pub"
          git config tag.gpgSign true
          cat > "$RUNNER_TEMP/tag-message.sh" <<'EOF'
          #!/bin/sh
          printf 'MowDeck %s\n' "$RELEASE_VERSION" > "$1"
          EOF
          chmod +x "$RUNNER_TEMP/tag-message.sh"
          {
            echo "GIT_EDITOR=$RUNNER_TEMP/tag-message.sh"
            echo "GIT_COMMITTER_NAME=mowdeck-release"
            echo "GIT_COMMITTER_EMAIL=155678024+lukislp@users.noreply.github.com"
          } >> "$GITHUB_ENV"
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # No retry from a newer tip (unlike the repositories that build after tagging from main):
      # the build jobs check out this run's commit, so the tag may only ever land on it. When a
      # push raced in, this job fails before tagging and the newer push's run releases.
      # The jobs below build this run's commit: make sure the tag exists on exactly that commit,
      # is signed and that GitHub verifies its signature.
      - name: Check the signed tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "$tag^{commit}")" = "$SHA"
          git cat-file -p "$tag" | grep -q 'BEGIN SSH SIGNATURE'
          gh release view "$tag" -R "$REPOSITORY" --json tagName --jq .tagName
          object="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
          verified="$(gh api "repos/$REPOSITORY/git/tags/$object" --jq '.verification.verified')"
          reason="$(gh api "repos/$REPOSITORY/git/tags/$object" --jq '.verification.reason')"
          if [ "$verified" != true ]; then
            echo "::warning::GitHub does not show $tag as verified (reason: $reason)."
          fi
          echo "- signed tag \`$tag\` (verified: $verified)" >> "$GITHUB_STEP_SUMMARY"

  # Licence gate (LICENSING.md, apps/web/README.md "Agora Web SDK and third-party licences"):
  # every image is built once for linux/amd64 into the runner's Docker engine, never pushed, and
  # checked before the images job publishes anything: no Agora package or file (the Agora SDKs
  # are proprietary and never redistributed), no licence that is not open source, the licence
  # label of the Dockerfile and the MowDeck licence texts inside. Its matrix equals the images
  # matrix (tools/repo-checks, test_release_licences.py).
  licence-gate:
    needs: [version, tag]
    # Checks the release tag (or the commit of a test build) after job tag and before anything is
    # pushed; status functions keep it from being skipped with tag on a test build.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.build == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: identity, context: ., file: services/identity/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: fleet, context: ., file: services/fleet/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: device-gateway, context: ., file: services/device-gateway/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0 AND GPL-3.0-only"}
          - {image: telemetry, context: ., file: services/telemetry/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: realtime, context: ., file: services/realtime/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: notifications, context: ., file: services/notifications/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: scheduler, context: ., file: services/scheduler/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: entitlements, context: ., file: services/entitlements/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: billing, context: ., file: services/billing/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: planner, context: ., file: services/planner/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: vision, context: ., file: services/vision/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: camera-relay, context: ., file: services/camera-relay/Dockerfile, kind: python, licenses: "AGPL-3.0-only AND Apache-2.0"}
          - {image: web, context: ., file: apps/web/Dockerfile, kind: web, licenses: "AGPL-3.0-only AND Apache-2.0", flags: --web}
          - {image: authz-bootstrap, context: infra/openfga, file: infra/openfga/bootstrap/Dockerfile, kind: bootstrap, licenses: "AGPL-3.0-only AND Apache-2.0 AND MIT AND GPL-2.0-only", flags: --no-licence-files}
    env:
      LOCAL: licence-gate/${{ matrix.image }}:${{ needs.version.outputs.version }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the image mirror
        run: sh infra/mirror-env.sh | tee -a "$GITHUB_ENV"
      # The same build arguments as the images job; nothing selects the Agora Web SDK
      # (WEB_AGORA_SDK), so the Dockerfile defaults apply.
      - name: Build arguments
        id: args
        env:
          KIND: ${{ matrix.kind }}
          RELEASE: ${{ needs.version.outputs.release }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          case "$KIND" in
            python) args="PYTHON_IMAGE=$PYTHON_IMAGE
          UV_IMAGE=$UV_IMAGE" ;;
            web) args="NODE_IMAGE=$NODE_IMAGE
          NGINX_IMAGE=$NGINX_IMAGE" ;;
            bootstrap) args="FGA_CLI_IMAGE=$FGA_CLI_IMAGE
          JQ_IMAGE=$JQ_IMAGE
          BUSYBOX_IMAGE=$BUSYBOX_IMAGE" ;;
          esac
          # The same version and source arguments as the images job (see there).
          source_ref="$SHA"
          [ "$RELEASE" = true ] && source_ref="v$VERSION"
          args="$args
          MOWDECK_VERSION=$VERSION
          MOWDECK_SOURCE_URL=$SOURCE_URL
          MOWDECK_SOURCE_REF=$source_ref"
          printf 'build-args<<EOF\n%s\nEOF\n' "$args" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build record artifact (*.dockerbuild): it would land among the release assets.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ steps.args.outputs.build-args }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.LOCAL }}
          # No build cache in release jobs (see the images job).
          no-cache: true
      - name: SBOM with licences (syft-json)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL }}
          format: syft-json
          output-file: ${{ runner.temp }}/sbom.syft.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check licences
        env:
          LICENSES: ${{ matrix.licenses }}
          FLAGS: ${{ matrix.flags }}
        run: |
          # shellcheck disable=SC2086 # FLAGS is a list of options
          python3 tools/repo-checks/scripts/licence_gate.py --image "$LOCAL" \
            --sbom "$RUNNER_TEMP/sbom.syft.json" --licenses "$LICENSES" $FLAGS

  images:
    needs: [version, tag, licence-gate]
    # Only after the licence gate passed for every image (on a test build tag is skipped, so the
    # condition names the gate instead of relying on the default success()).
    if: ${{ !cancelled() && needs.licence-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless signing (Sigstore) and build provenance attestations.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: identity, context: ., file: services/identity/Dockerfile, kind: python}
          - {image: fleet, context: ., file: services/fleet/Dockerfile, kind: python}
          - {image: device-gateway, context: ., file: services/device-gateway/Dockerfile, kind: python}
          - {image: telemetry, context: ., file: services/telemetry/Dockerfile, kind: python}
          - {image: realtime, context: ., file: services/realtime/Dockerfile, kind: python}
          - {image: notifications, context: ., file: services/notifications/Dockerfile, kind: python}
          - {image: scheduler, context: ., file: services/scheduler/Dockerfile, kind: python}
          - {image: entitlements, context: ., file: services/entitlements/Dockerfile, kind: python}
          - {image: billing, context: ., file: services/billing/Dockerfile, kind: python}
          - {image: planner, context: ., file: services/planner/Dockerfile, kind: python}
          - {image: vision, context: ., file: services/vision/Dockerfile, kind: python}
          - {image: camera-relay, context: ., file: services/camera-relay/Dockerfile, kind: python}
          - {image: web, context: ., file: apps/web/Dockerfile, kind: web}
          - {image: authz-bootstrap, context: infra/openfga, file: infra/openfga/bootstrap/Dockerfile, kind: bootstrap}
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/mowdeck/${{ matrix.image }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Base images as pinned in the Compose example file, pulled through the mirror.
      - name: Use the image mirror
        run: sh infra/mirror-env.sh | tee -a "$GITHUB_ENV"
      - name: Build arguments and tags
        id: args
        env:
          KIND: ${{ matrix.kind }}
          LATEST: ${{ needs.version.outputs.latest }}
          RELEASE: ${{ needs.version.outputs.release }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          case "$KIND" in
            python) args="PYTHON_IMAGE=$PYTHON_IMAGE
          UV_IMAGE=$UV_IMAGE" ;;
            web) args="NODE_IMAGE=$NODE_IMAGE
          NGINX_IMAGE=$NGINX_IMAGE" ;;
            bootstrap) args="FGA_CLI_IMAGE=$FGA_CLI_IMAGE
          JQ_IMAGE=$JQ_IMAGE
          BUSYBOX_IMAGE=$BUSYBOX_IMAGE" ;;
          esac
          # Version and source of the build for every image (AGPL-3.0 section 13: the services'
          # X-Source-Code header and the web app's source link, <MOWDECK_SOURCE_URL>/tree/<ref>):
          # MOWDECK_VERSION is the release (or test build) version, MOWDECK_SOURCE_REF the tag
          # v<version> for a release and the exact commit for a test build (it has no tag), and
          # MOWDECK_SOURCE_URL this repository, so a fork's images point to the fork.
          source_ref="$SHA"
          [ "$RELEASE" = true ] && source_ref="v$VERSION"
          args="$args
          MOWDECK_VERSION=$VERSION
          MOWDECK_SOURCE_URL=$SOURCE_URL
          MOWDECK_SOURCE_REF=$source_ref"
          tags="$IMAGE:$VERSION
          $IMAGE:v$VERSION"
          [ "$LATEST" = true ] && tags="$tags
          $IMAGE:latest"
          {
            printf 'build-args<<EOF\n%s\nEOF\n' "$args"
            printf 'tags<<EOF\n%s\nEOF\n' "$tags"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build record artifact (*.dockerbuild): it would land among the release assets.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ steps.args.outputs.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.args.outputs.tags }}
          labels: |
            org.opencontainers.image.title=mowdeck-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # SBOM and provenance attestations attached to the image index (buildx --sbom).
          sbom: true
          provenance: mode=max
          # Release images never read or write a shared cache: a cache entry written by another
          # workflow run (a pull request, a test build) must not end up in a published image.
          no-cache: true
      # Keyless signature of the image index, bound to this workflow's identity, and a GitHub
      # build provenance attestation pushed next to the image (gh attestation verify).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (Sigstore keyless) and verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -eu
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" > /dev/null
          echo "- \`$IMAGE@$DIGEST\` signed" >> "$GITHUB_STEP_SUMMARY"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "digest-${{ matrix.image }}.txt"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # The digest for the release notes (job publish).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt
          if-no-files-found: error
      # SPDX SBOM file of the pushed image for the GitHub release.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-release-assets: false

  chart:
    needs: [version, tag, licence-gate, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHARTS: oci://ghcr.io/${{ needs.version.outputs.owner }}/charts
      CHART: ghcr.io/${{ needs.version.outputs.owner }}/charts/mowdeck
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Package the chart (version and appVersion = release version)
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo add openfga https://openfga.github.io/helm-charts
          helm dependency build infra/helm/mowdeck
          helm package infra/helm/mowdeck --version "$VERSION" --app-version "$VERSION" -d dist
      - name: Push to GHCR
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/mowdeck-$VERSION.tgz" "$CHARTS" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest="$(awk '/^Digest:/ {print $2}' "$RUNNER_TEMP/helm-push.log")"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$CHART" "$digest" > dist/digest-chart.txt
          echo "- chart \`$CHARTS/mowdeck:$VERSION\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"
      # cosign and the provenance push read the Docker credential store; helm registry login
      # above only logs helm in.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the chart (Sigstore keyless) and verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -eu
          cosign sign --yes "$CHART@$DIGEST"
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CHART@$DIGEST" > /dev/null
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: |
            dist/mowdeck-${{ needs.version.outputs.version }}.tgz
            dist/digest-chart.txt
          if-no-files-found: error

  # The Android app shell (Capacitor). No Firebase, no Play Store: the APK is attached to the
  # GitHub release. Secrets: ANDROID_KEYSTORE_BASE64 (the .jks as base64), ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (optional, defaults to the keystore password). The
  # iOS app goes to TestFlight on demand from an existing release (apple-testflight.yml) or is
  # built and installed on the owner's Mac (apps/mobile/scripts), never in this workflow.
  android:
    needs: [version, tag]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.build == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MOWDECK_VERSION: ${{ needs.version.outputs.version }}
      MOWDECK_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      MOWDECK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MOWDECK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MOWDECK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Release keystore configured?
        id: keystore
        run: |
          if [ -z "$MOWDECK_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: no APK in this release (docs/ops/mobile-apps.md)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.keystore.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.keystore.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.keystore.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache in release jobs (cache poisoning, see the images job).
          package-manager-cache: false
      - if: steps.keystore.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # The runner image ships the Android SDK (ANDROID_HOME); Gradle fetches a missing platform.
      - if: steps.keystore.outputs.present == 'true'
        name: Build the APK
        run: bash apps/mobile/scripts/build-android.sh
      - if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: apps/mobile/build/mowdeck-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  # Signed, verifiable release assets (OpenSSF Scorecard "Signed-Releases"): SHA256SUMS over every
  # file, a Sigstore keyless bundle per file (*.sigstore.json) and one GitHub build provenance
  # attestation over all of them, attached as mowdeck-<version>.intoto.jsonl; then the image
  # digests and the verification commands go into the release notes.
  publish:
    needs: [version, tag, licence-gate, images, chart, android]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.tag.result == 'success' && needs.licence-gate.result == 'success' && needs.images.result == 'success' && needs.chart.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ needs.version.outputs.owner }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # The source offer script and the names of MowDeck's own packages, at the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      # Only the artifacts of the jobs above; release_assets.py then keeps only the release files
      # (SBOMs, chart, APK) and ignores anything else an action uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloads
          pattern: "{digest-*,sbom-*.spdx.json,chart,android-apk}"
          merge-multiple: true
      # The written offer for the GPL-family components of the images (SOURCE-OFFER.md), from the
      # SPDX SBOMs; checksummed, signed and attested with the other assets below.
      - name: Separate the digests, write the source offer and SHA256SUMS
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          python3 src/tools/repo-checks/scripts/release_assets.py select --version "$VERSION" \
            --downloads downloads --assets assets --digests digests
          python3 src/tools/repo-checks/scripts/source_offer.py --version "$VERSION" \
            --repository "$REPOSITORY" --repo-root src --out assets/SOURCE-OFFER.md \
            assets/sbom-*.spdx.json
          ls -l assets digests
          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" assets/SHA256SUMS
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every asset (Sigstore keyless) and verify
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -eu
          for file in assets/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
          cp "$BUNDLE" "assets/mowdeck-$VERSION.intoto.jsonl"
          python3 src/tools/repo-checks/scripts/release_assets.py check --version "$VERSION" \
            --assets assets
      - name: Attach the assets and complete the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          tag="v$VERSION"
          gh release view "$tag" -R "$REPOSITORY" --json tagName --jq .tagName
          gh release upload "$tag" -R "$REPOSITORY" --clobber assets/*
          gh release view "$tag" -R "$REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "helm install mowdeck oci://ghcr.io/$OWNER/charts/mowdeck --version $VERSION \\"
            echo "  -n mowdeck --create-namespace -f my-values.yaml"
            echo '```'
            echo
            echo "Operations manual: docs/ops/helm.md. Android app: \`mowdeck-$VERSION.apk\` below (if attached); iPhone and iPad app: TestFlight or built from the Mac (docs/ops/mobile-apps.md)."
            echo
            echo "## Images and chart (linux/amd64, linux/arm64)"
            echo
            echo "Tags \`$VERSION\`, \`v$VERSION\` and \`latest\`; pull by digest for an immutable reference."
            echo
            echo "| Artifact | Digest |"
            echo "| --- | --- |"
            for f in digests/*.txt; do
              ref="$(cat "$f")"
              echo "| \`${ref%@*}\` | \`${ref#*@}\` |"
            done
            echo
            echo "## Source code"
            echo
            echo "The images contain GPL, LGPL and AGPL software. \`SOURCE-OFFER.md\` below lists every such component with the location of its corresponding source and is a written offer to provide that source on request for at least three years; MowDeck's own source is this tag."
            echo
            echo "## Verify"
            echo
            echo "Tag \`$tag\` is SSH-signed. Images and chart are signed keyless with Sigstore and carry GitHub build provenance; every file below has a \`.sigstore.json\` bundle, \`SHA256SUMS\` lists them, and \`mowdeck-$VERSION.intoto.jsonl\` is their build provenance. Details: docs/ops/release.md#verifying-a-release."
            echo
            echo '```bash'
            echo "cosign verify ghcr.io/$OWNER/mowdeck/<image>@<digest> \\"
            echo "  --certificate-identity https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://ghcr.io/$OWNER/mowdeck/<image>@<digest> -R $REPOSITORY"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify mowdeck-$VERSION.tgz -R $REPOSITORY"
            echo '```'
          } >> notes.md
          gh release edit "$tag" -R "$REPOSITORY" --notes-file notes.md
          echo "- release \`$tag\` with $(ls assets | wc -l) assets" >> "$GITHUB_STEP_SUMMARY"
