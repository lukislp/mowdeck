name: OpenSSF Scorecard

# Supply-chain posture check (branch protection, pinned dependencies, token permissions,
# vulnerabilities, ...). Results land in the Security tab as code-scanning alerts and on
# https://scorecard.dev/viewer/?uri=github.com/lukislp/mowdeck. Read-only, non-blocking.
#
# Daily on a schedule (plus weekly and on branch protection changes), not after every ci run on
# main: one analysis costs 100-200 calls of GITHUB_TOKEN's hourly quota, and after each merge it
# competed with the release and fuzzing runs for it. Binary-Artifacts only counts the committed
# gradle-wrapper.jar as validated when a successful ci.yml run (the gradle-wrapper job) exists for
# the latest main commit; the scheduled run reads that from the API, long after the merge's ci
# run has finished, so it needs no workflow_run context. A newer run replaces a running one.
on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 1"
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: scorecard
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
