name: ci

# Minute budget: private repository, limited Actions minutes. Pull requests run the pipeline
# once (no duplicate push run); pushes to main run only the fast checks, because the merged
# content was already verified in the pull request. Superseded runs are cancelled.
#
# Pull requests are scoped by their changes (docs/dev/ci.md): the job `changes` maps the changed
# files to the jobs that check them (tools/repo-checks/scripts/ci_scope.py) and every other job
# is skipped with an `if:`. A skipped job counts as passed for a required check, so the workflow
# has no `paths` filter and always starts; an unknown path, a shared input (lock files,
# Dockerfiles, libs/, Compose) or a failed `changes` job runs the jobs as before. A pull request
# that only changes CI configuration runs `ci-config` (actionlint, shellcheck, repo-checks) and
# the jobs whose definition in this file changed. Pushes to main and manual runs are not scoped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Third-party images come from the repository's GHCR mirror, ghcr.io/<owner>/mowdeck/mirror/
  # <alias>:<tag>, which .github/workflows/mirror-images.yml fills from the "Image sources" of
  # infra/compose/.env.example (the one list of pinned images, CI-only ones included). The jobs
  # pull it with GITHUB_TOKEN: anonymous pulls from the public registries are rate limited (429
  # Too Many Requests) and the limit is shared by every GitHub-hosted runner behind one address.
  packages: read

env:
  MOWDECK_IMAGE_MIRROR: ghcr.io/${{ github.repository_owner }}/mowdeck/mirror
  # No build record artifact (*.dockerbuild) per docker/build-push-action step: about 30 per
  # run, and every artifact makes ClusterFuzzLite's corpus lookup (which pages through all
  # artifacts of the repository) and the API quota of GITHUB_TOKEN more expensive. The job
  # summary stays (DOCKER_BUILD_SUMMARY).
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Which jobs this run needs: one output per scoped job, "true" or "false". The other jobs run
  # unless their output is "false", so a failed classification runs them (fail safe).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.scope.outputs.python }}
      openfga_model: ${{ steps.scope.outputs.openfga_model }}
      docs: ${{ steps.scope.outputs.docs }}
      web: ${{ steps.scope.outputs.web }}
      compose: ${{ steps.scope.outputs.compose }}
      gradle_wrapper: ${{ steps.scope.outputs.gradle_wrapper }}
      helm: ${{ steps.scope.outputs.helm }}
      docker: ${{ steps.scope.outputs.docker }}
      camera_relay_media: ${{ steps.scope.outputs.camera_relay_media }}
      e2e: ${{ steps.scope.outputs.e2e }}
      e2e_web: ${{ steps.scope.outputs.e2e_web }}
      e2e_demo: ${{ steps.scope.outputs.e2e_demo }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # On a pull request HEAD is the merge commit; its first parent HEAD^1 is the base branch,
      # so the diff between them is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: false
      # PyYAML (the version of uv.lock) compares the jobs of this file between base and head.
      - name: Classify the changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- --base HEAD^1 --head HEAD
          else
            set -- --all
          fi
          scope="$(uv run --no-project --with pyyaml==6.0.3 python tools/repo-checks/scripts/ci_scope.py jobs "$@")"
          printf '%s\n' "$scope" | tee -a "$GITHUB_OUTPUT"

  # The CI configuration itself, on every pull request: actionlint (with shellcheck on every
  # run: block), shellcheck of the CI scripts, `reuse lint` (an SPDX licence and copyright for
  # every file) and, when the python job is skipped, lint and
  # tests of tools/repo-checks, which check the workflows, Dependabot and the release
  # configuration (the python job runs those tests itself otherwise).
  ci-config:
    if: ${{ !cancelled() && github.event_name != 'push' }}
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_<version>_linux_amd64.tar.gz from the release's checksums file
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      REPO_CHECKS: ${{ needs.changes.outputs.python == 'false' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: shellcheck (CI scripts)
        run: shellcheck tools/repo-checks/scripts/*.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
      # Every file names its licence and copyright: an SPDX header in the file, or REUSE.toml for
      # files without comments (CONTRIBUTING.md, "Licence headers").
      - name: REUSE lint
        run: uv run --no-project --with "reuse[charset-normalizer]==6.2.0" reuse lint
      - if: env.REPO_CHECKS == 'true'
        run: uv sync
      - if: env.REPO_CHECKS == 'true'
        name: Lint tools/repo-checks
        run: |
          uv run ruff check tools/repo-checks
          uv run ruff format --check tools/repo-checks
          uv run mypy tools/repo-checks
      - if: env.REPO_CHECKS == 'true'
        name: Test tools/repo-checks
        run: uv run pytest tools/repo-checks -p no:cacheprovider

  python:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # POSTGRES_IMAGE of infra/compose/.env.example through the mirror (the tag is checked by
        # repo-checks; a service container cannot run infra/mirror-env.sh, and the owner name is
        # lower case already).
        image: ghcr.io/${{ github.repository_owner }}/mowdeck/mirror/postgres:17.11-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Log in to GHCR and export NAME_IMAGE=<mirror>/<alias>:<tag> for every third-party image
      # pinned in infra/compose/.env.example (PYTHON_IMAGE, NATS_IMAGE, NTFY_IMAGE, ...) to the
      # following steps: the docker run commands and the build arguments pull from the mirror.
      - &ghcr-login
        name: Log in to the GHCR image mirror
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - &mirror-env
        name: Use the image mirror
        run: sh infra/mirror-env.sh | tee -a "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync
      - run: uv run poe lint
      # The web app's committed OpenAPI documents match the services (also a repo-checks test).
      - run: uv run poe openapi-check
      # Service containers cannot pass command arguments, so JetStream is started by hand.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 "$NATS_IMAGE" -js -m 8222
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8222/healthz && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      # A second NATS with the generated users and permissions (ADR 0074) and the development
      # passwords of .env.example: tools/repo-checks/tests/test_nats_auth_server.py checks that
      # a service user can do its work and nothing else.
      - name: Start NATS with the MowDeck users
        run: |
          grep '^NATS_PASSWORD_' infra/compose/.env.example > "$RUNNER_TEMP/nats.env"
          docker run -d --name nats-auth -p 4223:4222 -p 8223:8222 --env-file "$RUNNER_TEMP/nats.env" \
            -v "$PWD/infra/compose/nats:/etc/nats/mowdeck:ro" \
            "$NATS_IMAGE" -c /etc/nats/mowdeck/auth.conf -js -m 8222
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8223/healthz && exit 0
            sleep 1
          done
          docker logs nats-auth
          exit 1
      # In-memory OpenFGA for the mowdeck-authz integration tests (needs the "run" argument).
      - name: Start OpenFGA
        run: |
          docker run -d --name openfga -p 18080:8080 "$OPENFGA_IMAGE" run             --datastore-engine memory --authn-method preshared --authn-preshared-keys ci-key
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/healthz && exit 0
            sleep 1
          done
          docker logs openfga
          exit 1
      # ntfy for the notifications channel integration test (needs the "serve" argument).
      - name: Start ntfy
        run: |
          docker run -d --name ntfy -p 8091:80 "$NTFY_IMAGE" serve
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8091/v1/health && exit 0
            sleep 1
          done
          docker logs ntfy
          exit 1
      # stripe-mock for the Billing integration tests (stateless Stripe API, no webhooks).
      - name: Start stripe-mock
        run: |
          docker run -d --name stripe-mock -p 12111:12111 "$STRIPE_MOCK_IMAGE"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null -H "Authorization: Bearer sk_test_123" http://127.0.0.1:12111/v1/customers && exit 0
            sleep 1
          done
          docker logs stripe-mock
          exit 1
      - run: uv run poe test
        env:
          MOWDECK_TEST_STRIPE_MOCK_URL: http://127.0.0.1:12111
          MOWDECK_TEST_NTFY_URL: http://127.0.0.1:8091
          MOWDECK_TEST_NATS_URL: nats://127.0.0.1:4222
          MOWDECK_TEST_NATS_AUTH_URL: nats://127.0.0.1:4223
          MOWDECK_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5433/postgres
          MOWDECK_TEST_OPENFGA_URL: http://127.0.0.1:18080
          MOWDECK_TEST_OPENFGA_TOKEN: ci-key
      # Statement and branch coverage of the product code (tests omitted, [tool.coverage.run]).
      - name: Coverage summary
        run: |
          uv run coverage json -q -o "$RUNNER_TEMP/coverage.json"
          python3 tools/repo-checks/scripts/coverage_summary.py --python "$RUNNER_TEMP/coverage.json" \
            >> "$GITHUB_STEP_SUMMARY"

  # The authorization model: CLI model tests, freshness of the packaged JSON, and the
  # idempotent bootstrap job of the Compose stack (second run must not write a model).
  openfga-model:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.openfga_model != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *ghcr-login
      - *mirror-env
      - name: fga model test
        run: docker run --rm -v "$PWD/infra/openfga:/w" -w /w "$FGA_CLI_IMAGE" model test --tests model.fga.yaml
      # sync_model_json.py runs the CLI image named by FGA_CLI_IMAGE.
      - name: Packaged model.json matches model.fga
        run: python3 infra/openfga/sync_model_json.py --check
      - name: Bootstrap job is idempotent
        run: |
          docker network create fga
          docker run -d --name openfga --network fga "$OPENFGA_IMAGE" run             --datastore-engine memory --authn-method preshared --authn-preshared-keys ci-key
          docker build -t mowdeck/authz-bootstrap:ci -f infra/openfga/bootstrap/Dockerfile --build-arg FGA_CLI_IMAGE --build-arg JQ_IMAGE --build-arg BUSYBOX_IMAGE infra/openfga
          run_job() {
            docker run --rm --network fga -e FGA_API_URL=http://openfga:8080               -e FGA_API_TOKEN=ci-key mowdeck/authz-bootstrap:ci
          }
          for _ in $(seq 1 30); do run_job > first.log 2>&1 && break; sleep 1; done
          cat first.log
          grep -q "wrote model" first.log
          run_job | tee second.log
          grep -q "model unchanged" second.log

  docs:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync
      - run: uv run poe arch-diagrams-check
      - run: uv run poe api-reference-check
      - run: uv run poe capability-matrix-check
      - run: uv run poe docs

  # The web frontend (pnpm workspace): lint (ESLint, Prettier, Stylelint, i18n), svelte-check,
  # unit tests with coverage, generated types up to date, production build with CSP hashes.
  # apps/mobile is part of the workspace, so its lint, `tsc` check and tests run here too; the
  # native builds do not (Android: release.yml on v* tags, iOS: apple-testflight.yml on demand
  # or the owner's Mac; its App Store readiness checks run in the python job).
  web:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r check
      # The Playwright suite (tests/e2e-web) needs the stack: it runs in the e2e-web job.
      - run: pnpm -r --filter '!e2e-web' test
      - name: Coverage summary
        run: |
          python3 tools/repo-checks/scripts/coverage_summary.py --vitest apps/web \
            apps/web/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --filter ts-codegen check
      - run: pnpm --filter web build

  compose:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.compose != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.example config -q
      - run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml --env-file infra/compose/.env.example config -q
      - run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.demo.yml --env-file infra/compose/.env.example --env-file tests/e2e-web/demo.env config -q
      - run: bash -n infra/compose/demo/reset.sh
      # The load test (tests/load, docs/ops/load-testing.md; it runs in load-test.yml by hand):
      # its stack configuration, the report script and that every k6 scenario loads.
      - run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.demo.yml -f tests/load/docker-compose.load.yml --env-file infra/compose/.env.example --env-file tests/load/load.env config -q
      - run: node --test tests/load/report.test.mjs
      - run: bash -n tests/load/vps/ladder.sh && bash -n tests/load/vps/sample.sh
      - name: k6 scenarios load
        run: |
          for scenario in tests/load/scenarios/*.js; do
            docker run --rm -v "$PWD/tests/load:/load:ro" -w /load \
              grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d \
              inspect "scenarios/$(basename "$scenario")" > /dev/null
          done

  # apps/mobile/android keeps the standard committed Gradle wrapper (gradle-wrapper.jar); this
  # job checks the jar against the checksums Gradle publishes for its releases, so a modified
  # wrapper fails the pull request before release.yml ever runs it. It also runs on push to main
  # (no event condition; `changes` sets every output there): Scorecard's Binary-Artifacts check
  # needs a successful ci.yml run for the latest main commit. On a pull request only when the
  # wrapper (apps/mobile/android/gradle*) or this job changes.
  gradle-wrapper:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.gradle_wrapper != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  # The Helm chart without a cluster (about a minute): lint, template with the default values and
  # both overlays, kubeconform -strict, the required-secret checks and the Compose drift test
  # (infra/helm/check.sh). The kind install test is .github/workflows/helm-kind.yml (manual, tags).
  helm:
    needs: [changes]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.helm != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBECONFORM_VERSION: v0.8.0
      # sha256 of kubeconform-linux-amd64.tar.gz from the release's CHECKSUMS
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf kubeconform.tar.gz -C "$RUNNER_TEMP/bin" kubeconform
          rm kubeconform.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync
      - run: sh infra/helm/check.sh

  docker:
    needs: [changes]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.docker != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image ships ~30 GB of toolchains these jobs never use (Android, .NET, Haskell,
      # the CodeQL bundle). Without removing them the service images (vision's litellm above all)
      # and the Playwright image fill the disk: "no space left on device" while building.
      - &free-disk
        name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup             /opt/hostedtoolcache/CodeQL
          df -h /
      - *ghcr-login
      - *mirror-env
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # amd64 only for now; the images have no architecture specific steps, an arm64
      # build (QEMU or a native arm runner) follows with the release workflow.
      - name: Build device-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/device-gateway/Dockerfile
          build-args: &python-build-args |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            UV_IMAGE=${{ env.UV_IMAGE }}
          platforms: linux/amd64
          push: false
          tags: mowdeck/device-gateway:ci
          cache-from: type=gha,scope=device-gateway
