  # The camera relay's media plane (ADR 0045) against a real MediaMTX and the relay image
  # (services/camera-relay/tests/media): WHEP with aiortc, tickets, the freeze hook, the grace
  # and the release, and the transcoder on the recorded H.265 stream. About two minutes after the
  # cached image build.
  # The jobs below build the images themselves from the cache the docker job fills; they wait for
  # it when it runs and also run when it is skipped (only their own definition changed).
  camera-relay-media:
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.camera_relay_media != 'false' && contains(fromJSON('["success", "skipped"]'), needs.docker.result) }}
    runs-on: ubuntu-24.04
    needs: [changes, docker]
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *ghcr-login
      - *mirror-env
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the camera-relay image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/camera-relay/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/camera-relay:ci
          cache-from: type=gha,scope=camera-relay
      - name: Media plane integration tests
        run: uv run pytest services/camera-relay/tests/media -v -p no:cacheprovider --timeout 300
        env:
          MOWDECK_TEST_RELAY_MEDIA: "1"
          RELAY_TEST_IMAGE: mowdeck/camera-relay:ci
          RELAY_TEST_LOGS: camera-relay-media-logs.txt
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-relay-media-logs
          path: camera-relay-media-logs.txt
          retention-days: 7

  # Phase 1 acceptance test (docs/phases.md) against the full Compose stack.
  # The service images are built first with the GitHub Actions cache of the docker
  # job (same scopes); `compose up --build` then finds every layer in the builder.
  e2e:
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.e2e != 'false' && contains(fromJSON('["success", "skipped"]'), needs.python.result) && contains(fromJSON('["success", "skipped"]'), needs.docker.result) }}
    runs-on: ubuntu-24.04
    needs: [changes, python, docker]
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *free-disk
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
