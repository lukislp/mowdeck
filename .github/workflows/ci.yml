        with:
          name: e2e-logs
          path: e2e-logs.txt
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml down -v

  # Phase 2 gate (docs/phases.md): the Playwright suite tests/e2e-web against the full Compose
  # stack including the web app at /, on a phone (gate) and a desktop viewport.
  #
  # The suite alone takes 19-25 min on one runner, so it runs in four shards (Playwright
  # --shard=i/4), each on its own runner with its own stack: the specs register their own users
  # and accounts per run, so nothing is shared between them but the order inside a stack, which
  # one worker per shard keeps sequential as before. The shard jobs upload blob reports; the job
  # `e2e-web` below merges them into one HTML/JUnit/JSON report, lists the specs that passed only
  # on retry and is the required check of the branch ruleset.
  e2e-web-shard:
    name: e2e-web shard ${{ matrix.shard }}
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.e2e_web != 'false' && contains(fromJSON('["success", "skipped"]'), needs.web.result) && contains(fromJSON('["success", "skipped"]'), needs.docker.result) }}
    runs-on: ubuntu-24.04
    needs: [changes, web, docker]
    # A shard takes about 5 min of setup and a quarter of the suite; one retried slow spec (a test
    # timeout of 3 min) must still fit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # The browsers and their system libraries, prebuilt: no apt and no browser download per run
      # (which on 2026-10-22 crawled or hung on azure.archive.ubuntu.com). The one image pinned
      # outside infra/compose/.env.example: it bundles Chrome for Testing (Google's terms, Widevine
      # CDM) next to Playwright (Apache-2.0), Firefox (MPL-2.0) and WebKit (LGPL-2.1/BSD), so the
      # public GHCR mirror must not republish it (tools/repo-checks/tests/
      # test_release_licences.py, NOT_MIRRORED). CI-only, never part of a release. The tag must
      # equal the @playwright/test version of tests/e2e-web; after a Dependabot bump of that
      # package set v<version>-noble and the "Digest" line of
      # `docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble`.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *free-disk
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter e2e-web
      - *ghcr-login
      - *mirror-env
      # The image only fits the @playwright/test version it was built for, so a Dependabot bump of
      # that package fails here, with the line to change, instead of later with missing browsers.
      - name: Playwright image matches @playwright/test
        run: |
          installed=$(pnpm --filter e2e-web exec playwright --version | sed -n 's/^Version //p')
          image=${PLAYWRIGHT_IMAGE%%@*}
          tag=${image##*:}
          if [ -z "$installed" ] || [ "$tag" != "v${installed}-noble" ]; then
            echo "::error file=.github/workflows/ci.yml::PLAYWRIGHT_IMAGE (job e2e-web-shard) is ${tag}, but tests/e2e-web installs @playwright/test ${installed:-(unknown)}: set it to mcr.microsoft.com/playwright:v${installed}-noble@<digest> (docker buildx imagetools inspect)"
            exit 1
          fi
          echo "@playwright/test ${installed} = ${tag}"
      - name: Pull the Playwright image
        timeout-minutes: 10
        run: docker pull "$PLAYWRIGHT_IMAGE"
      # Firefox on Linux decodes H.264 (the camera relay's codec) only with Cisco's OpenH264
      # plugin, which a normal Firefox downloads by itself and Playwright's build does not. Fetch
      # the same build Firefox's update service names (pinned sha512) and point Firefox at it.
      - name: OpenH264 for Firefox
        run: |
          dir="$RUNNER_TEMP/gmp/gmp-gmpopenh264/2.6.0"
          mkdir -p "$dir"
          curl -fsSL -o "$RUNNER_TEMP/openh264.zip" https://ciscobinary.openh264.org/openh264-linux64-652bdb7719f30b52b08e506645a7322ff1b2cc6f.zip
          echo "f5246bf14d038adf4ce0c4360262ab722bc3de4220f047c3d542b4c564074b4877dc8659e3125c5171c749e7ce93f20cc63777eb5e1539e960670cbc5f30ac85  $RUNNER_TEMP/openh264.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/openh264.zip" -d "$dir"
          echo "MOZ_GMP_PATH=$dir" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/identity/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/identity:dev
          cache-from: type=gha,scope=identity
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/fleet/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/fleet:dev
          cache-from: type=gha,scope=fleet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/telemetry/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/telemetry:dev
          cache-from: type=gha,scope=telemetry
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/device-gateway/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/device-gateway:dev
          cache-from: type=gha,scope=device-gateway
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/realtime/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/realtime:dev
          cache-from: type=gha,scope=realtime
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/camera-relay/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/camera-relay:dev
          cache-from: type=gha,scope=camera-relay
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: *web-build-args
          load: true
          tags: mowdeck/web:dev
          cache-from: type=gha,scope=web
      # The example file, the mirror references and the suite's overrides (tests/e2e-web/stack.env:
      # static weather with the dev endpoint); a later line in .env overrides an earlier one.
      - name: Configure the stack
        run: |
          cp infra/compose/.env.example infra/compose/.env
          sh infra/mirror-env.sh >> infra/compose/.env
          grep '^[A-Z_]*=' tests/e2e-web/stack.env >> infra/compose/.env
      - name: Start the stack
        run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml up -d --build --wait --wait-timeout 600
      # The suite runs in the Playwright image while the stack stays on the runner. Host networking
      # keeps every address the same as on the runner: the web app at http://localhost and the
      # camera relay's ICE port on 127.0.0.1, which Firefox reaches only over loopback. The
      # workspace (with node_modules from the install above) and the OpenH264 plugin are mounted
      # at their runner paths, so pnpm's links and MOZ_GMP_PATH resolve unchanged. The `docker
      # exec` helpers of tests/support.ts use the runner's docker CLI (same Ubuntu release as the
      # image) against the runner's daemon. `npm test` runs the package's test script; the image
      # brings node and npm, not pnpm.
      - name: Phase 2 gate (Playwright, one shard)
        env:
          MOWDECK_E2E_BASE_URL: http://localhost
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          docker run --rm --init --ipc=host --network=host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/tests/e2e-web" \
            -v "$RUNNER_TEMP/gmp:$RUNNER_TEMP/gmp:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(command -v docker):/usr/local/bin/docker:ro" \
            -e CI -e MOWDECK_E2E_BASE_URL -e MOZ_GMP_PATH \
            "$PLAYWRIGHT_IMAGE" npm test -- "--shard=$SHARD"
      # ADR 0074: every flow of the shard stays within the services' NATS permissions.
      - name: No NATS permission violations
        run: sh infra/compose/nats-violations.sh -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml logs --no-color --timestamps > e2e-web-logs.txt
      # The blob report of the shard, also when it failed: the merge job builds the one report.
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-blob-${{ matrix.shard }}
          path: tests/e2e-web/blob-report
          # Only the e2e-web job of the same run reads it.
          retention-days: 2
          if-no-files-found: ignore
      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-failure-${{ matrix.shard }}
          path: |
            tests/e2e-web/test-results
            e2e-web-logs.txt
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml down -v

  # The public demo (ADR 0068): the test stack with docker-compose.demo.yml on top and the test
  # secrets of tests/e2e-web/demo.env; the seed job prepares the demo account, then the demo specs
  # (Playwright projects demo and demo-phone) run "Try the demo", the closed registration, the
  # banner on every main page and the API refusals.
  e2e-demo:
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.e2e_demo != 'false' && contains(fromJSON('["success", "skipped"]'), needs.web.result) && contains(fromJSON('["success", "skipped"]'), needs.docker.result) }}
    runs-on: ubuntu-24.04
    needs: [changes, web, docker]
    timeout-minutes: 30
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      COMPOSE_FILES: -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml -f infra/compose/docker-compose.demo.yml
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *free-disk
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter e2e-web
      - *ghcr-login
      - *mirror-env
      - name: Pull the Playwright image
        timeout-minutes: 10
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/identity/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/identity:dev
          cache-from: type=gha,scope=identity
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/fleet/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/fleet:dev
          cache-from: type=gha,scope=fleet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/telemetry/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/telemetry:dev
          cache-from: type=gha,scope=telemetry
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/device-gateway/Dockerfile
          build-args: *python-build-args
          load: true
          tags: mowdeck/device-gateway:dev
          cache-from: type=gha,scope=device-gateway
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: *web-build-args
          load: true
          tags: mowdeck/web:dev
          cache-from: type=gha,scope=web
      - name: Configure the stack
        run: |
          cp infra/compose/.env.example infra/compose/.env
          {
            sh infra/mirror-env.sh
            grep '^[A-Z_]*=' tests/e2e-web/stack.env
            grep '^[A-Z_]*=' tests/e2e-web/demo.env
          } >> infra/compose/.env
      # COMPOSE_FILES is a list of -f options, split on purpose (shellcheck SC2086).
      - name: Start the demo stack
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES up -d --build --wait --wait-timeout 600
      - name: Seed job output
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES logs --no-log-prefix demo-seed
      - name: Demo specs (Playwright)
        env:
          MOWDECK_E2E_BASE_URL: http://localhost
        run: |
          docker run --rm --init --ipc=host --network=host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/tests/e2e-web" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(command -v docker):/usr/local/bin/docker:ro" \
            -e MOWDECK_E2E_BASE_URL \
            "$PLAYWRIGHT_IMAGE" npm run demo
      # ADR 0074: the seed job and the demo specs stay within the services' NATS permissions.
      - name: No NATS permission violations
        run: |
          # shellcheck disable=SC2086
          sh infra/compose/nats-violations.sh $COMPOSE_FILES
      - name: Collect logs on failure
        if: failure()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES logs --no-color --timestamps > e2e-demo-logs.txt
      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-demo-failure
          path: |
            tests/e2e-web/test-results
            e2e-demo-logs.txt
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES down -v

  # The required check `e2e-web` (branch ruleset): merges the shards' blob reports into one report
  # and fails when a shard failed, was cancelled or did not run. Skipped (which the ruleset accepts)
  # when the pull request changes nothing the suite depends on.
  e2e-web:
    if: ${{ github.event_name != 'push' && !cancelled() && needs.changes.outputs.e2e_web != 'false' }}
    runs-on: ubuntu-24.04
    needs: [changes, e2e-web-shard]
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter e2e-web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-web-blob-*
          path: tests/e2e-web/all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports
        working-directory: tests/e2e-web
        run: pnpm exec playwright merge-reports --config=playwright.merge.config.ts ./all-blob-reports
      - name: Test the summary script
        working-directory: tests/e2e-web
        run: node --test scripts/markdown-cell.test.mjs
      - name: Flaky specs in the job summary
        working-directory: tests/e2e-web
        run: node scripts/flaky-summary.mjs merged-report/results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the merged report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-report
          path: tests/e2e-web/merged-report
          retention-days: 7
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-web-shard.result }}
        run: |
          echo "e2e-web shards: ${SHARDS}"
          [ "$SHARDS" = success ]
