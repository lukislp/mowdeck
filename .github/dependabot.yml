# Daily dependency PRs for the ecosystems this repository builds from, in the same shape as the
# other lukislp repositories: fix(...) commit prefixes, at most two open PRs per ecosystem.
#
# Not covered here, on purpose:
#   * Container images. Every third-party image is pinned once under "Image sources" in
#     infra/compose/.env.example and reaches the Dockerfiles, Compose and the Helm chart through
#     *_IMAGE variables and build arguments (FROM ${PYTHON_IMAGE}), which Dependabot's docker
#     ecosystem cannot parse; tools/repo-checks/tests/test_images.py keeps every default equal to
#     that list, so a partial bump would fail CI. Images are bumped deliberately in that list.
#     The one exception, PLAYWRIGHT_IMAGE in the e2e-web job of ci.yml (kept out of the public
#     mirror for its licence), follows @playwright/test (npm entry below): the job fails with
#     the line to change when the two differ, so its Dependabot PR gets the image bump too.
#   * The Capacitor shells in apps/mobile (Gradle, Swift package): their native dependencies come
#     from the @capacitor/* npm packages, which the npm entry below keeps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  # The fuzzing toolchain of the ClusterFuzzLite build image (Atheris, PyInstaller, coverage),
  # pinned with hashes in .clusterfuzzlite/requirements.txt (docs/dev/fuzzing.md).
  - package-ecosystem: pip
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  # One uv workspace with a single uv.lock for every service, library and tool.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # pymammotion (GPL adapter, mowdeck-control-mammotion) is pinned exactly and is NOT ignored:
    # every release changes the protocol surface the adapter depends on, so its PRs exist to make
    # new releases visible and are only merged after a test on a real mower.
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  # The pnpm workspace of the web frontend (apps/*, libs/mowdeck-ui, tests/e2e-web,
  # tools/ts-codegen) with its single pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Only minor and patch updates are grouped; every major arrives as its own PR so that one
    # breaking upgrade (SvelteKit, jsdom, ...) cannot hold back the routine bumps.
    groups:
      dev:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # @types/node follows the Node runtime (22, see "engines" in package.json and the Node
      # image); it is raised together with the runtime, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet; revisit once it declares support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
