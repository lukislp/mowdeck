# Daily dependency PRs for the ecosystems this repository builds from, in the same shape as the
# other lukislp repositories, at most two open PRs per ecosystem (uv: ten, see there). Commit
# prefixes decide the release (docs/ops/release.md, "CI-only changes"): runtime dependencies
# (uv, npm) are fix(deps) and release a patch; CI tooling (GitHub Actions, the ClusterFuzzLite
# toolchain) is ci and releases nothing (tools/repo-checks/tests/test_ci_scope.py).
#
# Not covered here, on purpose:
#   * Container images. Every third-party image is pinned once under "Image sources" in
#     infra/compose/.env.example and reaches the Dockerfiles, Compose and the Helm chart through
#     *_IMAGE variables and build arguments (FROM ${PYTHON_IMAGE}), which Dependabot's docker
#     ecosystem cannot parse; tools/repo-checks/tests/test_images.py keeps every default equal to
#     that list, so a partial bump would fail CI. Images are bumped deliberately in that list.
#     The same holds for PLAYWRIGHT_IMAGE in the e2e jobs of ci.yml (kept out of the public
#     mirror for its licence): it must equal @playwright/test, and Dependabot cannot change both
#     in one PR (it does not read the workflow env), so a lone @playwright/test bump failed every
#     e2e shard and held back the whole dev group. @playwright/test is therefore ignored below
#     and raised by hand together with the image (tests/e2e-web/README.md).
#   * The Capacitor shells in apps/mobile (Gradle, Swift package): their native dependencies come
#     from the @capacitor/* npm packages, which the npm entry below keeps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # A new release waits three days before Dependabot proposes it, except the lktec-bot
    # workflows: those are our own and a fix there should reach every caller right away.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/lktec-bot*"
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # Same for the lktec-bot workflows (automerge, lockfiles, release): one PR per release.
      lktec-bot:
        patterns:
          - "lukislp/lktec-bot*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # The fuzzing toolchain of the ClusterFuzzLite build image (Atheris, PyInstaller, coverage),
  # pinned with hashes in .clusterfuzzlite/requirements.txt (docs/dev/fuzzing.md).
  - package-ecosystem: pip
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
  # The Codespaces dev container (docs/adr/0080-codespaces-dev-container.md): the features in
  # .devcontainer/devcontainer.json, pinned by .devcontainer/devcontainer-lock.json. All feature
  # bumps share one PR. Dev tooling only, so ci: releases nothing.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    groups:
      devcontainer-features:
        patterns:
          - "*"
  # The base image of the dev container, pinned by digest in .devcontainer/Dockerfile (FROM
  # mcr.microsoft.com/devcontainers/python@sha256:...). The Dockerfile is the only one
  # Dependabot reads in this directory; the service Dockerfiles take their images from
  # *_IMAGE variables (see "Container images" above).
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
  # One uv workspace with a single uv.lock for every service, library and tool. From the root
  # Dependabot reads the root pyproject.toml and every workspace member's pyproject.toml (the
  # [tool.uv.workspace] members globs; they must not end in "/", which Dependabot's uv fetcher
  # does not match, so no member was read before), and updates uv.lock with them.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # Vendor libraries of the mower adapters, each pinned exactly in its adapter:
    # pymammotion (mowdeck-control-mammotion), pyworxcloud (mowdeck-control-worx) and
    # aioautomower (mowdeck-control-husqvarna). They are NOT ignored and NOT grouped: every
    # release gets its own PR, so new releases are visible. Such a PR is labelled vendor-lib and
    # needs-hardware-test (vendor-lib-label.yml), the check "vendor-lib / hardware test" fails
    # until the owner has tested it on a real mower and removed needs-hardware-test, and
    # the lktec-bot auto-merge never merges it (exclude in .github/lktec-bot.yml). Policy and checklist:
    # docs/ops/vendor-lib-updates.md.
    ignore:
      # The workspace members are sources of this repository ({ workspace = true }), but
      # Dependabot looks their names up on PyPI, where unrelated packages called fleet, vision,
      # telemetry, ... exist, and then fails the whole run ("your workspace requires fleet").
      # tools/repo-checks/tests/test_dependabot.py keeps this list equal to the members.
      - dependency-name: "mowdeck-*"
      - dependency-name: "agora-bridge"
      - dependency-name: "assistant"
      - dependency-name: "billing"
      - dependency-name: "camera-relay"
      - dependency-name: "device-gateway"
      - dependency-name: "entitlements"
      - dependency-name: "fleet"
      - dependency-name: "identity"
      - dependency-name: "notifications"
      - dependency-name: "planner"
      - dependency-name: "realtime"
      - dependency-name: "scheduler"
      - dependency-name: "telemetry"
      - dependency-name: "vision"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    # The vendor library PRs stay open until the hardware test (one slot each), so the limit
    # leaves room for the routine updates next to all three.
    open-pull-requests-limit: 10
  # The pnpm workspace of the web frontend (apps/*, libs/mowdeck-ui, tests/e2e-web,
  # tools/ts-codegen) with its single pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Only minor and patch updates are grouped; every major arrives as its own PR so that one
    # breaking upgrade (SvelteKit, jsdom, ...) cannot hold back the routine bumps.
    groups:
      dev:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # @types/node follows the Node runtime (24, see "engines" in package.json, .node-version and
      # NODE_IMAGE); its major is raised together with the runtime, not on its own (next: Node 26,
      # planned for mid-November 2026, docs/dev/web-app.md "Node version"). 24.x minors and
      # patches still arrive in the dev group.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet; revisit once it declares support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Raised by hand with PLAYWRIGHT_IMAGE in ci.yml (see the header): both must move together.
      - dependency-name: "@playwright/test"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
