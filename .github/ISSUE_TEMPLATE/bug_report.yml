name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag or commit you are running.
    validations:
      required: true
  - type: input
    id: mower
    attributes:
      label: Mower and link
      description: Mower model and firmware, and the link in use (cloud, Bluetooth bridge, simulator).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant log lines or a screenshot. Please remove tokens, account data, serial numbers and positions.
      render: text
