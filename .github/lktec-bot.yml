# Policy of the lktec-bot GitHub App for this repository. Committed to the default branch: the
# bot reads it from there, never from a pull request. See docs/modules/automerge.md in
# lukislp/lktec-bot for every key.
version: 1
modules:
  automerge:
    enabled: true
    # patch, minor and digest updates are armed; manual leaves majors to a person.
    majors: manual
    # auto arms a pull request that changes .github/workflows/; manual leaves it to a person.
    workflow-files: auto
    # How GitHub merges once the checks are green.
    method: squash
    # The vendor libraries of the mower adapters are never approved or armed, also inside a grouped
    # pull request: a bug in a release can break a command, in the worst case the emergency stop, so
    # the owner tests every update on a real mower first (docs/ops/vendor-lib-updates.md). Kept
    # equal to VENDOR_LIBS of tools/repo-checks/scripts/vendor_lib_guard.py by
    # tools/repo-checks/tests/test_dependabot.py.
    exclude: [pymammotion, pyworxcloud, aioautomower]

  # Tags and publishes a release from the Conventional Commits on the default branch (see
  # docs/modules/release.md in lukislp/lktec-bot). MowDeck stays on the 0.x line: a breaking
  # change is a minor release (docs/ops/release.md).
  release:
    enabled: true
    mode: tag
    tag-format: "v{version}"
    branch: main
    # Only used while no tag matches tag-format; the line starts at 0.x from the tag v0.0.0.
    first-version: "0.1.0"
    # Translated one to one from the former semantic-release rules.
    rules:
      - {breaking: true, release: minor}
      - {type: refactor, release: patch}
      - {type: fix, scope: ci, release: none}
