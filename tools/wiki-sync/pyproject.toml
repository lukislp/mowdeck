[project]
name = "mowdeck-wiki-sync"
version = "0.1.0"
description = "Generates a flat GitHub wiki mirror from the MkDocs documentation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "AGPL-3.0-only" }
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
wiki-sync = "wiki_sync.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_sync"]
