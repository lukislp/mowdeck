# Included in every location: nginx drops server level add_header when a location adds its own.
# The CSP comes from the build (build/csp.conf) and is rendered at container start with the
# optional tile host (40-mowdeck-runtime-config.sh).
include /tmp/mowdeck/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only over HTTPS: $mowdeck_hsts is empty for plain HTTP (or MOWDECK_WEB_HSTS=false), and nginx
# sends no header with an empty value (default.conf, 40-mowdeck-runtime-config.sh).
add_header Strict-Transport-Security $mowdeck_hsts always;
