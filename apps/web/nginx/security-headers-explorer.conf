# Security headers of the API explorer's frame (/_explorer/, ADR 0072), the one place with its own
# Content Security Policy. It differs from the app's (build/csp.conf) in exactly two points:
#
#   style-src 'unsafe-inline'  Scalar injects its stylesheet and its theme as <style> elements at
#                              runtime; the theme element is rendered by Vue without a nonce, so
#                              neither a nonce nor build-time hashes would hold across versions.
#                              Scripts stay 'self' only: no inline script, no eval, no other host.
#   frame-ancestors 'self'     the web app's page /api-explorer embeds the frame; nobody else may
#                              (X-Frame-Options SAMEORIGIN for older browsers).
#
# Everything else is as strict as the app: every fetch, image, font and worker from this origin
# only, so the frame cannot reach Scalar's services (fonts, proxy, registry, agent) or any other
# third party even if a setting were missed. The app's own CSP is untouched.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "no-cache" always;
