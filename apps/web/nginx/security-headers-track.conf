# Security headers of the public tracking page (/track): the same as security-headers.conf, but
# Referrer-Policy is no-referrer (the share token is in the URL fragment and must not leave in any
# referrer), the page is kept out of search indexes and caches. Included in every location of
# default.conf that serves /track (nginx drops server level add_header when a location adds its
# own, and a second add_header of the same name would send the header twice).
# The CSP comes from the build (build/csp.conf) and is rendered at container start with the
# optional tile host (40-mowdeck-runtime-config.sh).
include /tmp/mowdeck/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $mowdeck_hsts always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Cache-Control "no-store" always;
