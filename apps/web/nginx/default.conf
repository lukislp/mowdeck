# The web app behind Traefik. Static files only; /api/* never reaches this server (Traefik routes
# it to the services with a higher priority).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build output: cache for a year.
  location /_app/immutable/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /service-worker.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Runtime configuration, rendered from the environment at container start.
  location = /config.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/json;
    alias /tmp/mowdeck/config.json;
  }

  # The legal pages' Markdown (static/legal/*.md, replaceable by the operator with a volume):
  # always revalidated; a missing file is a 404, never the SPA fallback.
  location ~ ^/legal/[a-z]+\.md$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { }
    default_type text/markdown;
    charset_types text/markdown;
    try_files $uri =404;
  }

  # The notes of "Was ist neu" (build-tools/whats-new.mjs, written by the release build): always
  # revalidated; a build without them answers 404, never the SPA fallback.
  location = /whats-new.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/json;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # An API path that reaches the web app has no service behind it (e.g. Billing without the
  # "billing" profile): a JSON 404, never the SPA fallback, so probes see the service is absent.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/problem+json;
    return 404 '{"type":"urn:mowdeck:problem:not-found","title":"Not found","status":404,"detail":"no service answers this path"}';
  }

  # The API explorer's frame (ADR 0072): the pinned Scalar bundle, its glue and the services'
  # OpenAPI documents, with its own CSP. Only with MOWDECK_WEB_API_EXPLORER=true: otherwise
  # explorer.conf (40-mowdeck-runtime-config.sh) answers 404 and none of its files is served.
  location ^~ /_explorer/ {
    include /tmp/mowdeck/explorer.conf;
    include /etc/nginx/snippets/security-headers-explorer.conf;
    try_files $uri =404;
  }

  # The public share page of a tracking link (/track#<token>): the SPA shell, never cached, kept out
  # of search indexes, with Referrer-Policy no-referrer (security-headers-track.conf).
  location = /track {
    include /etc/nginx/snippets/security-headers-track.conf;
    try_files /200.html =404;
  }

  location ^~ /track/ {
    include /etc/nginx/snippets/security-headers-track.conf;
    try_files /200.html =404;
  }

  # Everything else: the file if it exists, otherwise the SPA fallback; always revalidated.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /200.html;
  }

  location = /200.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
