<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>MowDeck</title>
  </head>
  <body>
    <main class="page">
      <header class="band" aria-hidden="true">
        <svg class="mark" viewBox="0 0 100 100" focusable="false">
          <polygon points="50,22 78,76 50,62 22,76" />
        </svg>
      </header>
      <section class="panel">
        <div class="language" role="group" data-t-label="language">
          <button type="button" data-language="de" aria-pressed="false">Deutsch</button>
          <button type="button" data-language="en" aria-pressed="false">English</button>
        </div>
        <p class="overline">MowDeck · Server</p>
        <h1 data-t="title">Connect MowDeck</h1>
        <p class="lead" data-t="lead"></p>
        <p class="lead" data-t="explain"></p>
        <form id="connect" novalidate>
          <label class="field">
            <span class="label" data-t="label">Server address</span>
            <input
              id="server"
              name="server"
              type="url"
              inputmode="url"
              autocomplete="url"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="go"
              aria-describedby="hint message"
              data-t-placeholder="hint"
            />
            <span id="hint" class="hint" data-t="hint"></span>
          </label>
          <p id="message" class="message" role="alert" hidden></p>
          <div id="confirm" class="confirm" role="group" aria-labelledby="confirm-title" hidden>
            <p id="confirm-title" class="confirm-title"></p>
            <p id="confirm-body" class="hint"></p>
            <div class="actions">
              <button id="confirm-ok" class="primary" type="button"></button>
              <button id="confirm-cancel" class="secondary" type="button" data-t="cancel">
                Cancel
              </button>
            </div>
          </div>
          <div class="actions">
            <button id="submit" class="primary" type="submit" data-t="connect">Connect</button>
            <button id="anyway" class="secondary" type="button" data-t="useAnyway" hidden>
              Use anyway
            </button>
            <button
              id="demo"
              class="secondary"
              type="button"
              data-t="tryDemo"
              aria-describedby="demo-note"
            >
              Try the demo
            </button>
          </div>
          <p id="demo-note" class="hint" data-t="demoNote"></p>
        </form>
        <nav class="links" data-t-label="moreInfo">
          <a
            id="about"
            href="https://github.com/lukislp/mowdeck"
            target="_blank"
            rel="noopener noreferrer"
            data-t="about"
            >What is MowDeck?</a
          >
          <a
            id="privacy"
            href="https://github.com/lukislp/mowdeck/blob/main/docs/ops/mobile-apps.md#privacy"
            target="_blank"
            rel="noopener noreferrer"
            data-t="privacy"
            >Privacy</a
          >
          <a id="app-about" href="./about.html" data-t="aboutApp">About and licences</a>
        </nav>
      </section>
    </main>
    <script type="module" src="./src/launcher.ts"></script>
  </body>
</html>
